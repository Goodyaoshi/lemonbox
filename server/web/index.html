<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FDFBF7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17150F" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>柠檬百宝箱</title>
<style>
:root{
  --bg:#FDFBF7; --card:#FFFFFF; --card-2:#F6F1E9; --line:#EDE6DC;
  --text:#2B2622; --sub:#7C736A; --hint:#AFA69C;
  --brand:#EE9420; --brand-soft:#FBEFDD; --lemon:#F7D046; --danger:#D9534F;
  --shadow:0 6px 20px rgba(120,95,60,.10);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17150F; --card:#231F19; --card-2:#2C2720; --line:#332D25;
    --text:#F3EEE7; --sub:#A79C92; --hint:#7E746A;
    --brand:#F0A23C; --brand-soft:#3A2E1C; --lemon:#E7C33F; --danger:#E4786F;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.shell{max-width:600px; margin:0 auto; padding:0 16px}
.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{max-width:600px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.logo{
  width:34px;height:34px;border-radius:12px; flex:none;
  background:linear-gradient(140deg,var(--lemon),var(--brand));
  display:grid;place-items:center;font-size:19px;
}
.topbar h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px}
.topbar .who{font-size:12px; color:var(--sub); margin-top:1px}
.top-actions{margin-left:auto; display:flex; gap:6px}
.iconbtn{
  border:1px solid var(--line); background:var(--card); color:var(--text);
  min-width:40px;min-height:40px; border-radius:12px; font-size:16px; cursor:pointer;
  display:grid; place-items:center;
}
.iconbtn:disabled{opacity:.45}

h2.sect{
  font-size:13px; color:var(--sub); font-weight:600; letter-spacing:.3px;
  margin:22px 0 8px; display:flex; align-items:center; gap:8px;
}
h2.sect::before{content:""; width:4px;height:13px;border-radius:2px;background:var(--brand)}
.card{
  background:var(--card); border-radius:var(--r-lg);
  box-shadow:var(--shadow); overflow:hidden;
}
.card.pad{padding:14px}
.row{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; min-height:56px; cursor:pointer;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .grow{flex:1; min-width:0}
.row .t{font-weight:600; font-size:15px}
.row .s{font-size:12.5px; color:var(--hint); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .chev{color:var(--hint); flex:none; font-size:15px}
.ico{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:var(--brand-soft); display:grid; place-items:center; font-size:18px;
}
.pill{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--card-2); color:var(--sub);
  border-radius:999px; padding:2px 9px; font-size:12px; white-space:nowrap;
}
.pill.warn{background:color-mix(in srgb,var(--danger) 14%, transparent); color:var(--danger)}
.pill.brand{background:var(--brand-soft); color:var(--brand)}
.muted{color:var(--sub)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.center{text-align:center}
.empty{padding:34px 18px; text-align:center; color:var(--hint)}
.empty .big{font-size:30px; margin-bottom:8px}

.btn{
  appearance:none; border:0; cursor:pointer; font:inherit; font-weight:600;
  min-height:46px; border-radius:var(--r-md); padding:0 16px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--card-2); color:var(--text);
}
.btn.primary{background:linear-gradient(135deg,var(--lemon),var(--brand)); color:#3A2A06}
.btn.ghost{background:transparent; color:var(--brand); border:1px solid var(--line)}
.btn.danger{background:transparent; color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.sm{min-height:38px; padding:0 12px; font-size:13.5px; border-radius:var(--r-sm)}

input,select,textarea{
  font:inherit; width:100%; color:var(--text);
  background:var(--card-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:11px 12px; min-height:46px;
}
textarea{min-height:78px; resize:vertical}
input[type=date]{min-height:46px}
label.f{display:block; margin-bottom:10px}
label.f > span{display:block; font-size:12.5px; color:var(--sub); margin-bottom:5px}
.seg{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.seg .chip{
  border:1px solid var(--line); background:var(--card-2); color:var(--sub);
  border-radius:999px; padding:8px 14px; font-size:13.5px; cursor:pointer; min-height:38px;
  display:inline-flex; align-items:center;
}
.seg .chip.on{background:var(--brand); border-color:var(--brand); color:#fff}
.seg .chip.on.plain{background:var(--brand-soft); color:var(--brand); border-color:transparent}

/* 底部导航 */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:600px; margin:0 auto; display:flex}
.tab{
  flex:1; border:0; background:transparent; cursor:pointer; font:inherit;
  color:var(--hint); padding:8px 0 9px; min-height:60px;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px;
}
.tab .b{font-size:19px; line-height:1}
.tab.on{color:var(--brand); font-weight:700}

/* 浮层 */
.scrim{position:fixed; inset:0; background:rgba(30,24,16,.42); z-index:40;
  display:flex; align-items:flex-end; justify-content:center}
@media (min-width:520px){ .scrim{align-items:center} }
.sheet{
  background:var(--card); width:100%; max-width:600px;
  border-radius:22px 22px 0 0; max-height:88vh; overflow:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
}
@media (min-width:520px){ .sheet{border-radius:22px; max-width:520px} }
.sheet h3{margin:0 0 4px; font-size:17px}
.sheet .desc{color:var(--sub); font-size:13px; margin-bottom:14px}
.sheet-actions{display:flex; gap:10px; margin-top:16px}
.sheet-actions .btn{flex:1}

/* 底部提示条 */
.snack{
  position:fixed; left:12px; right:12px; bottom:calc(74px + env(safe-area-inset-bottom));
  max-width:576px; margin:0 auto; z-index:50;
  background:var(--text); color:var(--bg);
  border-radius:14px; padding:12px 14px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:10px; font-size:13.5px;
}
.snack button{
  margin-left:auto; background:transparent; border:0; font:inherit; font-weight:700;
  color:var(--lemon); cursor:pointer; min-height:34px; padding:0 6px;
}
.bar{height:6px;border-radius:999px;background:var(--card-2);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--brand);width:0;transition:width .18s}
.list-img{width:100%; border-radius:var(--r-md); margin-top:8px; display:block}
.kv{display:flex; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--sub); flex:none; min-width:76px}
.kv .v{flex:1; word-break:break-word}
a{color:var(--brand)}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="shell" id="view"></div>
<div class="tabbar" id="tabbar"></div>
<div id="overlay"></div>
<script>
"use strict";
/* =========================================================================
 * 柠檬百宝箱 · 网页版（iOS Safari 可用，无需 Apple 开发者证书）
 *
 * 与安卓端共用同一个 Cloudflare Worker 同步中枢与同一套记录契约：
 *   POST /v1/login   登录换令牌
 *   GET  /v1/pull    增量拉取（includeSelf=1 拉全量）
 *   POST /v1/push    按 baseSeq 推变更，服务端发现被人改过就报冲突
 *   POST /v1/blob/url 取图片临时地址
 *
 * 写入策略：**只打补丁、整条回写**——从服务端拉到的载荷原样保留其余字段，
 * 只改用户编辑的那几项，再整条 push。这样安卓端 decode 时字段一个不缺。
 * 不做离线：所有写操作都需要联网。
 * ========================================================================= */

/* ----------------------------------------------------------- 集合与常量 */

const COLL = {
  CATEGORIES: "categories",
  LOCATIONS: "locations",
  ITEMS: "items",
  ASSETS: "ledger_assets",
  LEDGER_CATS: "ledger_categories",
  LEDGER: "ledger_records",
  BUDGETS: "ledger_budgets",
  ANNIVERSARIES: "anniversaries",
  REMINDERS: "reminders",
  CAPSULES: "time_capsules",
  TRIPS: "packing_trips",
  PACK_ITEMS: "packing_items",
  TEMPLATES: "ledger_templates",
  RULES: "ledger_recurring_rules",
  PREFERENCES: "preferences"
};
const PREF_KEY = "preferences";
/** 对象键约定与服务端一致：images/<sha256>.jpg（见 ImageObjectKeys）。 */
const imageKey = (hash) => `images/${String(hash).split("|")[0]}.jpg`;

const USAGE = { UNUSED: 0, IN_USE: 1, USED_UP: 2 };
const DISPO = { IN_STOCK: 0, LENT: 1, GIVEN: 2, DISCARDED: 3 };
const USAGE_LABEL = { 0: "未使用", 1: "使用中", 2: "已用完" };
const DISPO_LABEL = { 0: "在库", 1: "借出", 2: "已送人", 3: "已丢弃" };
const LEDGER_TYPE = { 0: "支出", 1: "收入", 2: "转账" };
const ANNIV_TYPE = { 0: "倒数日", 1: "正数日", 2: "生日" };
const REPEAT_LABEL = { ONCE: "一次性", DAILY: "每天", INTERVAL: "隔几天", WEEKLY: "每周几" };
const FOR_WHOM = { self: "给自己", partner: "给她/他", shared: "一起用" };

/* --------------------------------------------------------------- 小工具 */

const $ = (id) => document.getElementById(id);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
    }));

/** 极简 DOM 构造器：字符串一律走 textContent，杜绝把用户数据当 HTML 注入。 */
function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "html") node.innerHTML = v;             // 仅用于本地常量图标
      else if (k === "style") node.style.cssText = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (k === "value") node.value = v;
      else if (k === "checked" || k === "disabled" || k === "selected") node[k] = !!v;
      else node.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
const pad2 = (n) => String(n).padStart(2, "0");
const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtDay = (ms) => { const d = new Date(ms); return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtTime = (ms) => {
  const d = new Date(ms), n = new Date();
  const same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  return (same ? "" : `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} `) + `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const dayStart = (str) => { const [y, m, d] = str.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const yuan = (cents) => (Number(cents || 0) / 100).toFixed(2).replace(/\.00$/, "");
const toCents = (text) => Math.round(Number(String(text).replace(/[^\d.]/g, "")) * 100) || 0;
const daysUntil = (ms) => Math.ceil((ms - Date.now()) / 86400000);
const esc = (s) => String(s ?? "");

/* ------------------------------------------------------------ 会话与状态 */

const LS_KEY = "lemonbox.web.session.v1";
const LS_DEV = "lemonbox.web.device.v1";

const S = {
  token: null, username: null, expiresAt: 0,
  deviceId: null, deviceName: "网页版",
  /** "collection\u0000key" -> { collection, key, data, seq, deleted } */
  records: new Map(),
  tab: "items",
  busy: false, syncing: false, lastSyncAt: null, conflictCount: 0,
  pendingRefresh: false
};
const rk = (c, k) => c + "\u0000" + k;
const allOf = (c) => [...S.records.values()].filter((r) => r.collection === c);
/** 「活」记录：载荷里的 deletedAt / purgedAt 才是权威墓碑标记。 */
const liveOf = (c) => allOf(c).filter((r) => !r.deleted && !recordDeleted(r.data));

function recordDeleted(d) { return !!d && (d.deletedAt != null || d.purgedAt != null); }

function loadSession() {
  // 设备标识必须先于会话恢复初始化：首次访问没有 LS_KEY，若在下面提前 return，
  // S.deviceId 会一直是 null，登录请求会被服务端以「缺少设备标识」拒绝。
  let dev = null;
  try { dev = localStorage.getItem(LS_DEV); } catch (_) {}
  if (!dev) { dev = uuid(); try { localStorage.setItem(LS_DEV, dev); } catch (_) {} }
  S.deviceId = dev;
  const ua = navigator.userAgent || "";
  const os = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Mac/.test(ua) ? "Mac" : /Android/.test(ua) ? "Android" : "浏览器";
  S.deviceName = "网页版 · " + os;

  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;        // 只跳过会话恢复，设备标识已经就绪
    const v = JSON.parse(raw);
    if (v && v.token && (!v.expiresAt || v.expiresAt > Date.now())) {
      S.token = v.token; S.username = v.username; S.expiresAt = v.expiresAt || 0;
    }
  } catch (_) { /* 损坏的本地会话忽略即可 */ }
}
function saveSession(token, username, expiresAt) {
  S.token = token; S.username = username; S.expiresAt = expiresAt || 0;
  try { localStorage.setItem(LS_KEY, JSON.stringify({ token, username, expiresAt })); } catch (_) {}
}
function clearSession() {
  S.token = null; S.username = null; S.expiresAt = 0;
  S.records.clear(); S.lastSyncAt = null;
  try { localStorage.removeItem(LS_KEY); } catch (_) {}
}

/* -------------------------------------------------------------- 网络层 */

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json" };
  if (opts.auth !== false && S.token) headers.Authorization = "Bearer " + S.token;
  let res;
  try {
    res = await fetch(path, {
      method: opts.method || "GET",
      headers,
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body),
      cache: "no-store",
    });
  } catch (e) {
    // fetch 抛 TypeError 时浏览器不会给出细节；把最可能的原因直接写出来，
    // 避免用户只看到「Failed to fetch」而不知道是 DNS 污染、网络被拦截还是服务不可达。
    throw new Error("连不上服务器（DNS 污染、网络被拦截或服务不可达），请检查网络后重试");
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
  if (!res.ok) {
    // 登录请求本身返回 401 时不要清会话/重绘：那会把用户刚输入的账号密码一起清掉。
    if (res.status === 401 && opts.auth !== false) { clearSession(); render(); }
    throw new Error((data && data.error) || `请求失败（${res.status}）`);
  }
  return data;
}

/* ------------------------------------------------------------ 同步逻辑 */

/** 全量拉取：从 0 号开始，逐页循环直到服务端说没有更多。 */
async function pullAll() {
  let since = 0, guard = 0;
  const out = [];
  for (;;) {
    const r = await api(`/v1/pull?since=${since}&limit=500&includeSelf=1`);
    for (const ch of (r && r.changes) || []) out.push(ch);
    if (!r || !r.hasMore || !r.changes || !r.changes.length) break;
    since = r.lastSeq;
    if (++guard > 60) break;
  }
  return out;
}

function adopt(ch) {
  let data = null;
  try { data = JSON.parse(ch.payload); } catch (_) { return; }
  S.records.set(rk(ch.collection, ch.key), {
    collection: ch.collection, key: ch.key, data, seq: Number(ch.seq || 0), deleted: !!ch.deleted,
  });
}

async function syncNow(quiet) {
  if (S.syncing || !S.token) return;
  S.syncing = true; render();
  try {
    const changes = await pullAll();
    for (const ch of changes) adopt(ch);
    S.lastSyncAt = Date.now();
    const st = await api("/v1/stats").catch(() => null);
    S.conflictCount = st ? Number(st.conflictCount || 0) : 0;
    if (!quiet) snack(`同步完成 · 拉取 ${changes.length} 条变更`);
  } catch (e) {
    if (!quiet) snack("同步失败：" + e.message);
  } finally {
    S.syncing = false; render();
  }
}

/**
 * 整条回写：把改动合并进原载荷后推上去。
 * baseSeq 取自本机见到这条时的服务端序号；服务端发现有人在这之后改过会报冲突，
 * 此时把服务端那一版采纳到本机并提示用户重新编辑（绝不静默覆盖）。
 */
async function commit(collection, key, mutate, options = {}) {
  const existing = S.records.get(rk(collection, key));
  const base = existing ? JSON.parse(JSON.stringify(existing.data)) : {};
  const payload = mutate(base) || base;
  payload.updatedAt = Date.now();
  if (!payload.syncId) payload.syncId = key;
  const deleted = options.deleted !== undefined ? !!options.deleted : recordDeleted(payload);
  const baseSeq = existing ? existing.seq : 0;

  const r = await api("/v1/push", {
    method: "POST",
    body: { changes: [{ collection, key, payload: JSON.stringify(payload), baseSeq, deleted }] },
  });
  const conflicts = (r && r.conflicts) || [];
  if (conflicts.length) {
    const c = conflicts[0];
    adopt({ collection: c.collection, key: c.key, payload: c.payload, seq: c.seq, deleted: c.deleted });
    render();
    throw new Error("这条记录刚在别的设备上改过，已换成最新版本，请重新修改一次");
  }
  const applied = (r && r.applied && r.applied[0]) || null;
  S.records.set(rk(collection, key), {
    collection, key, data: payload, seq: applied ? Number(applied.seq) : baseSeq + 1, deleted,
  });
  render();
  return payload;
}

/** 软删除：写墓碑而不是物理删，另一台设备据此同步删除。 */
const softDelete = (collection, key) =>
  commit(collection, key, (d) => { d.deletedAt = Date.now(); d.purgedAt = null; return d; }, { deleted: true });

/** 撤销软删除：把墓碑清掉，同一条记录复活。 */
const unDelete = (collection, key) =>
  commit(collection, key, (d) => { d.deletedAt = null; d.purgedAt = null; return d; }, { deleted: false });

/* ------------------------------------------------------- 新记录构造器 */

function nextId(collection) {
  let max = 0;
  for (const r of allOf(collection)) max = Math.max(max, Number(r.data.id || 0));
  return max + 1;
}
const stamp = () => ({ id: 0, syncId: uuid(), updatedAt: Date.now(), deletedAt: null });

/** 新载荷一律带齐「无默认值」的必填字段，安卓端 decode 才不会整条失败。 */
function blank(collection, fields) {
  const now = Date.now();
  let d;
  switch (collection) {
    case COLL.CATEGORIES:
      d = { id: 0, name: "", icon: "📦", parentId: null, parentSyncId: null, isProtected: false, ...stamp() };
      break;
    case COLL.LOCATIONS:
      d = { id: 0, name: "", parentId: null, parentSyncId: null, isProtected: false, ...stamp() };
      break;
    case COLL.ITEMS:
      d = {
        id: 0, name: "", barcode: null, categoryId: null, locationId: null,

      d = { ...stamp() };

  d.id = nextId(collection);

  return d;
}

/**
 * 新建一条记录并推上服务端。
 * 只在服务端确实收下之后才登记进本机视图——否则推送失败会在列表里留下
 * 一条只存在于浏览器、云端根本没有的「幽灵记录」。
 */
async function create(collection, fields, keyOf) {
  const data = blank(collection, fields);
  const key = keyOf ? keyOf(data) : data.syncId;
  data.syncId = key;
  const r = await api("/v1/push", {
    method: "POST",
    body: { changes: [{ collection, key, payload: JSON.stringify(data), baseSeq: 0, deleted: false }] },
  });
  const conflicts = (r && r.conflicts) || [];
  if (conflicts.length) {
    const c = conflicts[0];
    // 极罕见（同一条刚被别的设备建过）：采纳服务端版本并如实告知，不静默丢弃。
    adopt({ collection: c.collection, key: c.key, payload: c.payload, seq: c.seq, deleted: c.deleted });
    render();
    throw new Error("这条记录刚在别的设备上建过，已换成最新版本");
  }
  const applied = (r && r.applied && r.applied[0]) || null;
  S.records.set(rk(collection, key), {
    collection, key, data, seq: applied ? Number(applied.seq) : 0, deleted: false,
  });
  render();
  return data;
}

/* ------------------------------------------------------------------ 提示 */

let snackTimer = null;
function snack(text, undo) {
  const box = h("div", { class: "snack" }, h("span", { text }));
  if (undo) box.append(h("button", { text: "撤销", onClick: async () => { box.remove(); await undo(); } }));
  else box.append(h("button", { text: "知道了", onClick: () => box.remove() }));
  document.body.append(box);
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => box.remove(), undo ? 7000 : 3200);
}

function busyRun(fn) {
  return async (...args) => {
    if (S.busy) return;
    S.busy = true; render();
    const done = (msg, undo) => { if (msg) snack(msg, undo); };
    try { const r = await fn(...args); done(r && r.msg, r && r.undo); }
    catch (e) { snack(e && e.message ? e.message : "操作没成功，请再试一次"); }
    finally { S.busy = false; render(); }
  };
}

/* -------------------------------------------------------------- 浮层 UI */

function sheet(title, desc, bodyBuilder, actions) {
  const host = $("overlay");
  const close = () => { host.innerHTML = ""; };
  const panel = h("div", { class: "sheet" }, h("h3", { text: title }));
  if (desc) panel.append(h("div", { class: "desc", text: desc }));
  const body = h("div");
  panel.append(body);
  bodyBuilder(body, close);
  if (actions) {
    const bar = h("div", { class: "sheet-actions" });
    for (const a of actions) bar.append(a(close));
    panel.append(bar);
  }
  const scrim = h("div", { class: "scrim", onClick: (e) => { if (e.target === scrim) close(); } }, panel);
  host.innerHTML = "";
  host.append(scrim);
  return close;
}

function field(label, input) {
  return h("label", { class: "f" }, h("span", { text: label }), input);
}
function textInput(value, placeholder, type) {
  return h("input", { type: type || "text", value: value ?? "", placeholder: placeholder || "", inputmode: type === "number" ? "decimal" : null });
}
function selectInput(options, value) {
  const sel = h("select");
  for (const [v, label] of options) {
    const o = h("option", { value: v, text: label });
    if (String(v) === String(value)) o.selected = true;
    sel.append(o);
  }
  return sel;
}
function chipGroup(entries, value, onPick, plain) {
  const wrap = h("div", { class: "seg" });
  let current = value;
  const paint = () => {
    [...wrap.children].forEach((c) => c.classList.toggle("on", c.dataset.v === String(current)));
  };
  for (const [v, label] of entries) {
    wrap.append(h("button", {
      class: "chip" + (plain ? " plain" : ""), "data-v": v, text: label,
      onClick: () => { current = v; paint(); onPick(v); },
    }));
  }
  paint();
  return { node: wrap, get: () => current };
}

/* --------------------------------------------------------------- 视图层 */

function categoriesOf() {
  return liveOf(COLL.CATEGORIES).sort((a, b) => String(a.data.name).localeCompare(String(b.data.name), "zh"));
}
function locationsOf() {
  return liveOf(COLL.LOCATIONS).sort((a, b) => String(a.data.name).localeCompare(String(b.data.name), "zh"));
}
function assetsOf() { return liveOf(COLL.ASSETS).sort((a, b) => (a.data.sort || 0) - (b.data.sort || 0)); }
function ledgerCatsOf(kind) {
  return liveOf(COLL.LEDGER_CATS)
    .filter((r) => Number(r.data.kind || 0) === kind)
    .sort((a, b) => (a.data.sort || 0) - (b.data.sort || 0));
}
function nameOf(collection, syncId) {
  if (!syncId) return "";
  for (const r of allOf(collection)) if (r.data.syncId === syncId && !recordDeleted(r.data)) return r.data.name || "";
  return "";
}
function itemsOf() {
  return liveOf(COLL.ITEMS).sort((a, b) => {
    const ea = a.data.expireTime, eb = b.data.expireTime;
    if (ea && eb) return ea - eb;
    if (ea) return -1;
    if (eb) return 1;
    return (b.data.createdAt || 0) - (a.data.createdAt || 0);
  });
}

function ledgerSheet(r) {
  const d = r ? r.data : blank(COLL.LEDGER);

      chipGroup([[0, "支出"], [1, "收入"], [2, "转账"]], type, (v) => { type = Number(v); paintFields(); }).node,
      field("金额（元）", amount),
      helper,
      field("日期", when),
      field("备注", remark)
    );
    const catSel = { value: d.categorySyncId || "" };
    const assetSel = { value: d.assetSyncId || "" };
    const targetSel = { value: d.targetAssetSyncId || "" };
    function paintFields() {
      helper.innerHTML = "";
      const assets = assetsOf();
      const assetOptions = [["", "不指定账户"], ...assets.map((x) => [x.data.syncId, x.data.name])];
      if (type === 2) {
        helper.append(
          field("从（转出账户）", (() => { const s = selectInput(assetOptions, assetSel.value); s.onchange = () => (assetSel.value = s.value); return s; })()),

      } else {
        helper.append(
          field("分类", (() => { const s = selectInput([["", "未分类"], ...ledgerCatsOf(type).map((x) => [x.data.syncId, x.data.name])], catSel.value); s.onchange = () => (catSel.value = s.value); return s; })()),
          field("账户", (() => { const s = selectInput(assetOptions, assetSel.value); s.onchange = () => (assetSel.value = s.value); return s; })()));

    paintFields();
    body.append(h("div", { class: "sheet-actions" },
      h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存", disabled: S.busy, onClick: busyRun(async () => {
        const cents = toCents(amount.value);
        if (cents <= 0) throw new Error("金额要大于 0");
        const fields = {
          type, amount: cents, recordTime: when.value ? dayStart(when.value) : Date.now(),
          remark: remark.value, categorySyncId: type === 2 ? null : (catSel.value || null),
          assetSyncId: assetSel.value || null, targetAssetSyncId: type === 2 ? (targetSel.value || null) : null,
        };
        if (r) {
          await commit(COLL.LEDGER, r.key, (p) => { Object.assign(p, fields); return p; });
        } else {
          const data = blank(COLL.LEDGER, fields);

function bought(r) {
  const prev = { needRestock: r.data.needRestock, quantity: r.data.quantity };
  busyRun(async () => {
    await commit(COLL.ITEMS, r.key, (p) => { p.needRestock = false; p.quantity = Math.max(1, Number(p.quantity) || 1); return p; });
    return {
      msg: `「${r.data.name}」已标记买到`,
      // 硬规则：已买到必须可撤销。
      undo: () => commit(COLL.ITEMS, r.key, (p) => { p.needRestock = prev.needRestock; p.quantity = prev.quantity; return p; })
        .then(() => snack("已撤销")),
    };
  })();
}
function markNeed(r) {
  busyRun(async () => {
    await commit(COLL.ITEMS, r.key, (p) => { p.needRestock = true; return p; });
    return {
      msg: `「${r.data.name}」已加入要买的`,
      undo: () => commit(COLL.ITEMS, r.key, (p) => { p.needRestock = false; return p; }).then(() => snack("已撤销")),
    };
  })();
}

  for (const r of ledgerCatsOf(0)) cats.append(h("div", { class: "row", onClick: () => ledgerCatSheet(r) },
    h("div", { class: "ico", text: r.data.icon || "🧾" }),
    h("div", { class: "grow" }, h("div", { class: "t", text: r.data.name }), h("div", { class: "s", text: "支出分类" })),
    h("div", { class: "chev", text: "›" })));
  for (const r of ledgerCatsOf(1)) cats.append(h("div", { class: "row", onClick: () => ledgerCatSheet(r) },
    h("div", { class: "ico", text: r.data.icon || "🧾" }),
    h("div", { class: "grow" }, h("div", { class: "t", text: r.data.name }), h("div", { class: "s", text: "收入分类" })),
    h("div", { class: "chev", text: "›" })));
  cats.append(h("div", { class: "row", onClick: () => ledgerCatSheet(null) },
    h("div", { class: "ico", text: "＋" }), h("div", { class: "grow" }, h("div", { class: "t", text: "新增记账分类" }))));
  root.append(h("h2", { class: "sect", text: "记账分类" }), cats);

  const hc = h("div", { class: "card" });
  for (const r of categoriesOf()) hc.append(h("div", { class: "row", onClick: () => categorySheet(r) },
    h("div", { class: "ico", text: r.data.icon || "📦" }),
    h("div", { class: "grow" }, h("div", { class: "t", text: r.data.name }),
      h("div", { class: "s", text: r.data.isProtected ? "内置保护分类" : "自定义分类" })),
    h("div", { class: "chev", text: "›" })));
  for (const r of locationsOf()) hc.append(h("div", { class: "row", onClick: () => locationSheet(r) },
    h("div", { class: "ico", text: "📍" }),
    h("div", { class: "grow" }, h("div", { class: "t", text: r.data.name }),
      h("div", { class: "s", text: r.data.isProtected ? "内置保护位置" : "自定义位置" })),
    h("div", { class: "chev", text: "›" })));
  root.append(h("h2", { class: "sect", text: "家当分类与位置" }), hc);
}

function assetSheet(r) {
  const d = r ? r.data : blank(COLL.ASSETS);
  sheet(r ? "账户" : "新增账户", null, (body, close) => {
    const name = textInput(d.name || "", "例如：招行储蓄卡");
    const icon = textInput(d.icon || "💳", "图标（一个 emoji）");
    const balance = textInput(d.initialBalance ? yuan(d.initialBalance) : "0", "0", "number");
    body.append(field("名称", name), field("图标", icon), field("初始余额（元）", balance));
    body.append(h("div", { class: "sheet-actions" },
      h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存", disabled: S.busy, onClick: busyRun(async () => {
        if (!name.value.trim()) throw new Error("名称不能为空");
        const fields = { name: name.value.trim(), icon: icon.value.trim() || "💳", initialBalance: toCents(balance.value) };
        if (r) await commit(COLL.ASSETS, r.key, (p) => { Object.assign(p, fields); return p; });
        else { const data = blank(COLL.ASSETS, fields); await create(COLL.ASSETS, data, () => data.syncId); }
        close(); return { msg: "已保存" };
      }) }),
      r ? h("button", { class: "btn danger", text: "删除", onClick: busyRun(async () => {
        close(); await softDelete(COLL.ASSETS, r.key);
        return { msg: "已删除账户", undo: () => unDelete(COLL.ASSETS, r.key).then(() => snack("已恢复")) };
      }) }) : h("button", { class: "btn", text: "取消", onClick: close })));
  });
}
function ledgerCatSheet(r) {
  const d = r ? r.data : blank(COLL.LEDGER_CATS);
  sheet(r ? "记账分类" : "新增记账分类", null, (body, close) => {
    const name = textInput(d.name || "", "例如：餐饮");
    const icon = textInput(d.icon || "🧾", "图标");
    let kind = Number(d.kind || 0);
    body.append(field("名称", name), field("图标", icon),
      chipGroup([[0, "支出"], [1, "收入"]], kind, (v) => { kind = Number(v); }).node);
    body.append(h("div", { class: "sheet-actions" },
      h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存", disabled: S.busy, onClick: busyRun(async () => {
        if (!name.value.trim()) throw new Error("名称不能为空");
        const fields = { name: name.value.trim(), icon: icon.value.trim() || "🧾", kind };
        if (r) await commit(COLL.LEDGER_CATS, r.key, (p) => { Object.assign(p, fields); return p; });
        else { const data = blank(COLL.LEDGER_CATS, fields); await create(COLL.LEDGER_CATS, data, () => data.syncId); }
        close(); return { msg: "已保存" };
      }) }),
      r ? h("button", { class: "btn danger", text: "删除", onClick: busyRun(async () => {
        if (r.data.isProtected) throw new Error("内置保护分类不能删");
        close(); await softDelete(COLL.LEDGER_CATS, r.key);
        return { msg: "已删除", undo: () => unDelete(COLL.LEDGER_CATS, r.key).then(() => snack("已恢复")) };
      }) }) : h("button", { class: "btn", text: "取消", onClick: close })));
  });
}
function categorySheet(r) {
  const d = r.data;
  sheet("分类", null, (body, close) => {
    const name = textInput(d.name, "分类名");
    const icon = textInput(d.icon || "📦", "图标");
    body.append(field("名称", name), field("图标", icon));
    body.append(h("div", { class: "sheet-actions" },
      h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存", disabled: S.busy, onClick: busyRun(async () => {
        if (!name.value.trim()) throw new Error("名称不能为空");
        await commit(COLL.CATEGORIES, r.key, (p) => { p.name = name.value.trim(); p.icon = icon.value.trim() || "📦"; return p; });
        close(); return { msg: "已保存" };
      }) }),
      h("button", { class: "btn danger", text: "删除", onClick: busyRun(async () => {
        if (d.isProtected) throw new Error("内置保护分类不能删");
        close(); await softDelete(COLL.CATEGORIES, r.key);
        return { msg: "已删除", undo: () => unDelete(COLL.CATEGORIES, r.key).then(() => snack("已恢复")) };
      }) })));
  });
}
function locationSheet(r) {
  const d = r.data;
  sheet("位置", null, (body, close) => {
    const name = textInput(d.name, "位置名");
    body.append(field("名称", name));
    body.append(h("div", { class: "sheet-actions" },
      h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存", disabled: S.busy, onClick: busyRun(async () => {
        if (!name.value.trim()) throw new Error("名称不能为空");
        await commit(COLL.LOCATIONS, r.key, (p) => { p.name = name.value.trim(); return p; });
        close(); return { msg: "已保存" };
      }) }),
      h("button", { class: "btn danger", text: "删除", onClick: busyRun(async () => {
        if (d.isProtected) throw new Error("内置保护位置不能删");
        close(); await softDelete(COLL.LOCATIONS, r.key);
        return { msg: "已删除", undo: () => unDelete(COLL.LOCATIONS, r.key).then(() => snack("已恢复")) };
      }) })));
  });
}

function emptyCard(icon, title, sub) {
  return h("div", { class: "card empty" },
    h("div", { class: "big", text: icon }),
    h("div", { style: "font-weight:600;color:var(--text)", text: title }),
    h("div", { class: "small", style: "margin-top:4px", text: sub }));
}

/* ------------------------------------------------------------- 登录视图 */

function viewLogin(root) {
  const card = h("div", { class: "card pad", style: "margin-top:40px" });
  card.append(
    h("div", { style: "font-size:22px;font-weight:700;margin-bottom:4px", text: "柠檬百宝箱 · 网页版" }),
    h("div", { class: "small muted", style: "margin-bottom:16px", html:
      "不用装 App、不用证书：用云端账号登录后，在浏览器里看与改家当、记账、待买、提醒、纪念日、胶囊、打包。" }));
  const user = textInput("", "账号");
  const pass = h("input", { type: "password", placeholder: "密码" });
  card.append(field("账号", user), field("密码", pass));
  const submit = h("button", { class: "btn primary block", text: "登录", style: "margin-top:6px",
    onClick: async () => {
      if (S.busy) return;
      if (!user.value.trim() || !pass.value) { snack("请输入账号和密码"); return; }
      // 不要在这里 render()：重建登录视图会把用户刚输入的账号密码一起清掉。
      // 直接改按钮状态，失败时保留输入。
      S.busy = true;
      submit.disabled = true;
      submit.textContent = "登录中…";
      try {
        const r = await api("/v1/login", { auth: false, method: "POST", body: {
          username: user.value.trim(), password: pass.value, deviceId: S.deviceId, deviceName: S.deviceName } });
        saveSession(r.token, (r.user && r.user.name) || user.value.trim(), r.expiresAt);
        pass.value = "";
        S.busy = false;
        render();
        snack("登录成功，正在同步云端数据…");
        // quiet=false：首次同步失败必须让用户看到原因，否则只会看到一屏空白。
        await syncNow(false);
      } catch (e) {
        snack(e && e.message ? e.message : "登录失败，请再试一次");
      } finally {
        S.busy = false;
        submit.disabled = false;
        submit.textContent = "登录";
      }
    } });
  card.append(submit);
  card.append(h("div", { class: "tiny muted", style: "margin-top:12px", html:
    "账号与云端由你自己搭建的同步服务管理；登录只换取一个会话令牌，密码不会留在浏览器里。" }));
  root.append(card);
}

/* --------------------------------------------------------------- 渲染 */

const TABS = [
  ["items", "🧺", "家当"],
  ["ledger", "🧾", "记账"],
  ["tobuy", "🛒", "待买"],
  ["reminders", "⏰", "提醒"],
  ["more", "⋯", "更多"],
];
const EXTRA_VIEWS = { anniversaries: "纪念日", capsules: "时间胶囊", packing: "打包清单", taxonomy: "账户与分类" };

function go(tab) {
  S.tab = tab;
  window.scrollTo({ top: 0 });
  render();
}

function renderTopbar() {
  const bar = $("topbar");
  bar.innerHTML = "";
  const inner = h("div", { class: "topbar-in" },
    h("div", { class: "logo", text: "🍋" }),
    h("div", null,
      h("h1", { text: "柠檬百宝箱" }),
      h("div", { class: "who", text: S.username ? `已登录 · ${S.username}` : "网页版" })));
  const actions = h("div", { class: "top-actions" });
  if (S.token) {
    actions.append(h("button", { class: "iconbtn", title: "同步", text: S.syncing ? "…" : "⟳",
      disabled: S.syncing || S.busy, onClick: () => syncNow(false) }));
  }
  inner.append(actions);
  bar.append(inner);
}

function renderTabbar() {
  const bar = $("tabbar");
  bar.innerHTML = "";
  if (!S.token) return;
  const inner = h("div", { class: "tabbar-in" });
  for (const [id, icon, label] of TABS) {
    const on = S.tab === id || (EXTRA_VIEWS[S.tab] && id === "more");
    inner.append(h("button", { class: "tab" + (on ? " on" : ""), onClick: () => go(id) },
      h("span", { class: "b", text: icon }), h("span", { text: label })));
  }
  bar.append(inner);
}

function render() {
  renderTopbar();
  renderTabbar();
  const root = $("view");
  root.innerHTML = "";
  if (!S.token) { viewLogin(root); return; }
  if (S.syncing && !S.records.size) {
    root.append(h("div", { class: "card pad center muted", style: "margin-top:40px" },
      h("div", { text: "正在同步云端数据…" }), h("div", { class: "bar" }, h("i", { style: "width:60%" }))));
    return;
  }
  switch (S.tab) {
    case "items": viewItems(root); break;
    case "ledger": viewLedger(root); break;
    case "tobuy": viewToBuy(root); break;
    case "reminders": viewReminders(root); break;
    case "anniversaries": viewAnniversaries(root); break;
    case "capsules": viewCapsules(root); break;
    case "packing": viewPacking(root); break;
    case "taxonomy": viewTaxonomy(root); break;
    default: viewMore(root);
  }
  if (["items", "ledger", "more", "tobuy"].includes(S.tab)) addFab(root);
}

/** 悬浮「＋」：按当前栏目给对应的新建动作。 */
function addFab(root) {
  const fabFor = { items: newItemSheet, ledger: () => ledgerSheet(null), tobuy: newItemSheet };
  const fn = fabFor[S.tab];
  if (!fn) return;
  const fab = h("button", {
    class: "fab", title: "新增",
    style: "position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;" +
      "width:54px;height:54px;border-radius:18px;border:0;cursor:pointer;font-size:26px;color:#3A2A06;" +
      "background:linear-gradient(135deg,var(--lemon),var(--brand));box-shadow:var(--shadow)",
    text: "＋", onClick: fn,
  });
  document.body.append(fab);
}

/* ------------------------------------------------------------------ 启动 */

loadSession();
render();
if (S.token) syncNow(true);
window.addEventListener("focus", () => { if (S.token && !S.syncing && Date.now() - (S.lastSyncAt || 0) > 60000) syncNow(true); });
// 每次重渲染先清掉上一帧遗留的悬浮按钮。
const _render = render;
render = function () { document.querySelectorAll(".fab").forEach((n) => n.remove()); _render(); };
</script>
