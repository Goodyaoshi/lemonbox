<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!--
  页面只加载同源脚本/样式与 Cloudflare 的统计脚本；图片来自对象存储的预签名 HTTPS 地址。
  内联脚本是单文件网页的既有实现，故保留 'unsafe-inline'，但把 connect-src 收在同源，
  避免 token 被意外发往第三方。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:" />
<meta name="theme-color" content="#FAFDF6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#161F19" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>柠檬百宝箱</title>
<style>
:root{
  /* 与安卓端共用一套叶绿 / 柠檬语义色：网页不是另一个品牌，只是同一份数据的另一扇窗。 */
  --bg:#FAFDF6; --card:#FFFFFF; --card-2:#F1F8EA; --line:#E6EFDD;
  --text:#2F3A2C; --sub:#52614C; --hint:#66745F;
  --brand:#3D7A2B; --brand-soft:#F1F8EA; --lemon:#EFC22E; --danger:#C6433A;
  --on-brand:#FFFFFF;
  --shadow:0 2px 8px rgba(47,58,44,.06);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161F19; --card:#1F2B22; --card-2:#243026; --line:#2E3B30;
    --text:#E8F0E4; --sub:#AAB8A4; --hint:#8A9683;
    --brand:#7CC95C; --brand-soft:#212E1E; --lemon:#E7C33F; --danger:#F08B84;
    --on-brand:#10240C;
    --shadow:0 1px 0 rgba(255,255,255,.04);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.shell{max-width:600px; margin:0 auto; padding:0 16px}
.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{max-width:600px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.logo{
  width:34px;height:34px;border-radius:12px; flex:none;
  background:linear-gradient(140deg,var(--lemon),#F7D64A);
  display:grid;place-items:center;font-size:19px;
}
.topbar h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px}
.topbar .who{font-size:12px; color:var(--sub); margin-top:1px}
.top-actions{margin-left:auto; display:flex; gap:6px}
.iconbtn{
  border:1px solid var(--line); background:var(--card); color:var(--text);
  min-width:44px;min-height:44px; border-radius:12px; font-size:16px; cursor:pointer;
  display:grid; place-items:center;
}
.iconbtn:disabled{opacity:.45}

h2.sect{
  font-size:13px; color:var(--sub); font-weight:600; letter-spacing:.3px;
  margin:22px 0 8px; display:flex; align-items:center; gap:8px;
}
.card{
  background:var(--card); border-radius:var(--r-lg);
  border:1px solid var(--line);
  box-shadow:var(--shadow); overflow:hidden;
}
.card.pad{padding:14px}
.row{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; min-height:56px; cursor:pointer;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row .grow{flex:1; min-width:0}
.row .t{font-weight:600; font-size:15px}
.row .s{font-size:12.5px; color:var(--hint); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .chev{color:var(--hint); flex:none; font-size:15px}
.ico{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:var(--brand-soft); display:grid; place-items:center; font-size:18px;
}
.pill{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--card-2); color:var(--sub);
  border-radius:999px; padding:2px 9px; font-size:12px; white-space:nowrap;
}
.pill.warn{background:color-mix(in srgb,var(--danger) 14%, transparent); color:var(--danger)}
.pill.brand{background:var(--brand-soft); color:var(--brand)}
.muted{color:var(--sub)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.center{text-align:center}
.empty{padding:34px 18px; text-align:center; color:var(--hint)}
.empty .big{font-size:30px; margin-bottom:8px}

.btn{
  appearance:none; border:0; cursor:pointer; font:inherit; font-weight:600;
  min-height:46px; border-radius:var(--r-md); padding:0 16px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--card-2); color:var(--text);
}
.btn.primary{background:var(--brand); color:var(--on-brand)}
.btn.ghost{background:transparent; color:var(--brand); border:1px solid var(--line)}
.btn.danger{background:transparent; color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.sm{min-height:38px; padding:0 12px; font-size:13.5px; border-radius:var(--r-sm)}

input,select,textarea{
  font:inherit; width:100%; color:var(--text);
  background:var(--card-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:11px 12px; min-height:46px;
}
textarea{min-height:78px; resize:vertical}
input[type=date]{min-height:46px}
label.f{display:block; margin-bottom:10px}
label.f > span{display:block; font-size:12.5px; color:var(--sub); margin-bottom:5px}
.seg{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.seg .chip{
  border:1px solid var(--line); background:var(--card-2); color:var(--sub);
  border-radius:999px; padding:8px 14px; font-size:13.5px; cursor:pointer; min-height:44px;
  display:inline-flex; align-items:center;
}
.seg .chip.on{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.seg .chip.on.plain{background:var(--brand-soft); color:var(--brand); border-color:transparent}

/* 底部导航 */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-in{max-width:600px; margin:0 auto; display:flex}
.tab{
  flex:1; border:0; background:transparent; cursor:pointer; font:inherit;
  color:var(--hint); padding:8px 0 9px; min-height:60px;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px;
}
.tab .b{font-size:19px; line-height:1}
.tab.on{color:var(--brand); font-weight:700}

/* 浮层 */
.scrim{position:fixed; inset:0; background:rgba(30,24,16,.42); z-index:40;
  display:flex; align-items:flex-end; justify-content:center}
@media (min-width:520px){ .scrim{align-items:center} }
/* 桌面浏览器不把内容锁在 600px 手机壳里：给到 760px，手机上完全不变。 */
@media (min-width:900px){
  .shell,.topbar-in,.tabbar-in{max-width:760px}
}
.sheet{
  background:var(--card); width:100%; max-width:600px;
  border-radius:22px 22px 0 0; max-height:88vh; overflow:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
}
@media (min-width:520px){ .sheet{border-radius:22px; max-width:520px} }
.sheet h3{margin:0 0 4px; font-size:17px}
.sheet .desc{color:var(--sub); font-size:13px; margin-bottom:14px}
.sheet-actions{display:flex; gap:10px; margin-top:16px}
.sheet-actions .btn{flex:1}

/* 底部提示条 */
.snack{
  position:fixed; left:12px; right:12px; bottom:calc(74px + env(safe-area-inset-bottom));
  max-width:576px; margin:0 auto; z-index:50;
  background:var(--text); color:var(--bg);
  border-radius:14px; padding:12px 14px; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:10px; font-size:13.5px;
}
.snack button{
  margin-left:auto; background:transparent; border:0; font:inherit; font-weight:700;
  color:var(--lemon); cursor:pointer; min-height:34px; padding:0 6px;
}
.bar{height:6px;border-radius:999px;background:var(--card-2);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--brand);width:0;transition:width .18s}
.list-img{width:100%; border-radius:var(--r-md); margin-top:8px; display:block}
.kv{display:flex; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--sub); flex:none; min-width:76px}
.kv .v{flex:1; word-break:break-word}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.row:focus-visible{outline-offset:-2px}
@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="shell" id="view"></div>
<div class="tabbar" id="tabbar"></div>
<div id="overlay"></div>
<script>
"use strict";
/* =========================================================================
 * 柠檬百宝箱 · 网页版（iOS Safari 可用，无需 Apple 开发者证书）
 *
 * 与安卓端共用同一个 Cloudflare Worker 同步中枢与同一套记录契约：
 *   POST /v1/login   登录换令牌
 *   GET  /v1/pull    增量拉取（includeSelf=1 拉全量）
 *   POST /v1/push    按 baseSeq 推变更，服务端发现被人改过就报冲突
 *   POST /v1/blob/url 取图片临时地址
 *
 * 写入策略：**只打补丁、整条回写**——从服务端拉到的载荷原样保留其余字段，
 * 只改用户编辑的那几项，再整条 push。这样安卓端 decode 时字段一个不缺。
 * 不做离线：所有写操作都需要联网。
 * ========================================================================= */

/* ----------------------------------------------------------- 集合与常量 */

const COLL = {
  CATEGORIES: "categories",
  LOCATIONS: "locations",
  ITEMS: "items",
  ASSETS: "ledger_assets",
  LEDGER_CATS: "ledger_categories",
  LEDGER: "ledger_records",
  BUDGETS: "ledger_budgets",
  ANNIVERSARIES: "anniversaries",
  REMINDERS: "reminders",
  CAPSULES: "time_capsules",
  TRIPS: "packing_trips",
  PACK_ITEMS: "packing_items",
  TEMPLATES: "ledger_templates",
  RULES: "ledger_recurring_rules",
  PREFERENCES: "preferences"
};
const PREF_KEY = "preferences";
/** 对象键约定与服务端一致：images/<sha256>.jpg（见 ImageObjectKeys）。 */
const imageKey = (hash) => `images/${String(hash).split("|")[0]}.jpg`;

const USAGE = { UNUSED: 0, IN_USE: 1, USED_UP: 2 };
const DISPO = { IN_STOCK: 0, LENT: 1, GIVEN: 2, DISCARDED: 3 };
const USAGE_LABEL = { 0: "未使用", 1: "使用中", 2: "已用完" };
const DISPO_LABEL = { 0: "在库", 1: "借出", 2: "已送人", 3: "已丢弃" };
const LEDGER_TYPE = { 0: "支出", 1: "收入", 2: "转账" };
const ANNIV_TYPE = { 0: "倒数日", 1: "正数日", 2: "生日" };
const REPEAT_LABEL = { ONCE: "一次性", DAILY: "每天", INTERVAL: "隔几天", WEEKLY: "每周几" };
const FOR_WHOM = { self: "给自己", partner: "给她/他", shared: "一起用" };

/* --------------------------------------------------------------- 小工具 */

const $ = (id) => document.getElementById(id);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
    }));

/** 极简 DOM 构造器：字符串一律走 textContent，杜绝把用户数据当 HTML 注入。 */
function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  let hasClick = false;
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "html") node.innerHTML = v;             // 仅用于本地常量图标
      else if (k === "style") node.style.cssText = v;
      else if (k.startsWith("on") && typeof v === "function") {
        // 事件名必须小写：onClick.slice(2) 是 "Click"，addEventListener("Click")
        // 永远不会触发，表现为所有按钮点了没反应（登录按钮因此不发请求）。
        if (k === "onClick") hasClick = true;
        node.addEventListener(k.slice(2).toLowerCase(), v);
      }
      else if (k === "value") node.value = v;
      else if (k === "checked" || k === "disabled" || k === "selected") node[k] = !!v;
      else node.setAttribute(k, v);
    }
  }
  // 列表行是 div，不是 <button>；补上键盘焦点与角色，否则只能鼠标/触摸点。
  if (hasClick && node.classList.contains("row")) {
    node.tabIndex = 0;
    node.setAttribute("role", "button");
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
const pad2 = (n) => String(n).padStart(2, "0");
const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtDay = (ms) => { const d = new Date(ms); return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtTime = (ms) => {
  const d = new Date(ms), n = new Date();
  const same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  return (same ? "" : `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} `) + `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const dayStart = (str) => { const [y, m, d] = str.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const yuan = (cents) => (Number(cents || 0) / 100).toFixed(2).replace(/\.00$/, "");
const toCents = (text) => Math.round(Number(String(text).replace(/[^\d.]/g, "")) * 100) || 0;
const daysUntil = (ms) => Math.ceil((ms - Date.now()) / 86400000);
const esc = (s) => String(s ?? "");

/* ------------------------------------------------------------ 会话与状态 */

const LS_KEY = "lemonbox.web.session.v1";
const LS_DEV = "lemonbox.web.device.v1";

const S = {
  token: null, username: null, expiresAt: 0,
  deviceId: null, deviceName: "网页版",
  /** "collection\u0000key" -> { collection, key, data, seq, deleted } */
  records: new Map(),
  /** 已落地的服务端序号；持久化到 IndexedDB，刷新后从这里增量。 */
  since: 0,
  /** 服务端实例标识：删库重建后会变，变了就清缓存重新快照。 */
  instanceId: "",
  /** IndexedDB 句柄；不可用（隐私模式等）时为 null，退回纯内存。 */
  cacheDb: null,
  tab: "items",
  busy: false, syncing: false, lastSyncAt: null, conflictCount: 0,
  ledgerLimit: 60,
  pendingRefresh: false
};
const rk = (c, k) => c + "\u0000" + k;
const allOf = (c) => [...S.records.values()].filter((r) => r.collection === c);
/** 「活」记录：载荷里的 deletedAt / purgedAt 才是权威墓碑标记。 */
const liveOf = (c) => allOf(c).filter((r) => !r.deleted && !recordDeleted(r.data));

function recordDeleted(d) { return !!d && (d.deletedAt != null || d.purgedAt != null); }

function loadSession() {
  // 设备标识必须先于会话恢复初始化：首次访问没有 LS_KEY，若在下面提前 return，
  // S.deviceId 会一直是 null，登录请求会被服务端以「缺少设备标识」拒绝。
  let dev = null;
  try { dev = localStorage.getItem(LS_DEV); } catch (_) {}
  if (!dev) { dev = uuid(); try { localStorage.setItem(LS_DEV, dev); } catch (_) {} }
  S.deviceId = dev;
  const ua = navigator.userAgent || "";
  const os = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Mac/.test(ua) ? "Mac" : /Android/.test(ua) ? "Android" : "浏览器";
  S.deviceName = "网页版 · " + os;

  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;        // 只跳过会话恢复，设备标识已经就绪
    const v = JSON.parse(raw);
    if (v && v.token && (!v.expiresAt || v.expiresAt > Date.now())) {
      S.token = v.token; S.username = v.username; S.expiresAt = v.expiresAt || 0;
    }
  } catch (_) { /* 损坏的本地会话忽略即可 */ }
}
function saveSession(token, username, expiresAt) {
  S.token = token; S.username = username; S.expiresAt = expiresAt || 0;
  // 新会话/换账号：内存视图和实例标识都作废。缓存由第一次 syncNow 在拉快照前清掉，
  // 避免“清缓存”和“写新快照”两个异步事务互相覆盖。
  S.records.clear(); S.since = 0; S.instanceId = ""; S.ledgerLimit = 60;
  try { localStorage.setItem(LS_KEY, JSON.stringify({ token, username, expiresAt })); } catch (_) {}
}
function clearSession() {
  S.token = null; S.username = null; S.expiresAt = 0;
  S.records.clear(); S.lastSyncAt = null; S.since = 0; S.instanceId = ""; S.ledgerLimit = 60;
  cacheClear(S.cacheDb);
  try { localStorage.removeItem(LS_KEY); } catch (_) {}
}

/* -------------------------------------------------------------- 网络层 */

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json" };
  if (opts.auth !== false && S.token) headers.Authorization = "Bearer " + S.token;
  let res;
  try {
    res = await fetch(path, {
      method: opts.method || "GET",
      headers,
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body),
      cache: "no-store",
    });
  } catch (e) {
    // fetch 抛 TypeError 时浏览器不会给出细节；把最可能的原因直接写出来，
    // 避免用户只看到「Failed to fetch」而不知道是 DNS 污染、网络被拦截还是服务不可达。
    throw new Error("连不上服务器（DNS 污染、网络被拦截或服务不可达），请检查网络后重试");
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = null; }
  if (!res.ok) {
    // 登录请求本身返回 401 时不要清会话/重绘：那会把用户刚输入的账号密码一起清掉。
    if (res.status === 401 && opts.auth !== false) { clearSession(); render(); }
    throw new Error((data && data.error) || `请求失败（${res.status}）`);
  }
  return data;
}

/* ------------------------------------------------------------ 同步逻辑 */

/* ------------------------------------------------------------ 本地快照缓存 */

/**
 * Web 没有本地数据库，但每次打开都从服务端全量重建会让首屏干等几十个请求。
 * 这里把上一轮成功同步的记录和序号放进 IndexedDB：启动先渲染缓存，
 * 再用 `/v1/meta` 判断要不要拉增量。服务端始终是权威，缓存只是首屏副本。
 */
const CACHE_DB = "lemonbox.cache.v2";
const CACHE_RECORDS = "records";
const CACHE_META = "meta";
const CACHE_META_KEY = "state";
const SNAPSHOT_LIMIT = 500;
const MAX_PULL_PAGES = 100;

function cacheOpen() {
  return new Promise((resolve) => {
    if (!("indexedDB" in window)) return resolve(null);
    let req;
    try { req = indexedDB.open(CACHE_DB, 1); } catch (_) { return resolve(null); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(CACHE_RECORDS)) db.createObjectStore(CACHE_RECORDS, { keyPath: "rk" });
      if (!db.objectStoreNames.contains(CACHE_META)) db.createObjectStore(CACHE_META, { keyPath: "k" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}
function cacheDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
async function cacheLoad(db) {
  if (!db) return null;
  try {
    const meta = await new Promise((resolve, reject) => {
      const r = db.transaction(CACHE_META, "readonly").objectStore(CACHE_META).get(CACHE_META_KEY);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => reject(r.error);
    });
    if (!meta) return null;
    const rows = await new Promise((resolve, reject) => {
      const r = db.transaction(CACHE_RECORDS, "readonly").objectStore(CACHE_RECORDS).getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
    return { meta, rows };
  } catch (_) { return null; }
}
function cacheRow(row) {
  return {
    rk: rk(row.collection, row.key), collection: row.collection, key: row.key,
    data: row.data, seq: Number(row.seq || 0), deleted: !!row.deleted,
  };
}
async function cachePutRecords(db, rows) {
  if (!db || !rows || !rows.length) return;
  try {
    const tx = db.transaction(CACHE_RECORDS, "readwrite");
    const store = tx.objectStore(CACHE_RECORDS);
    for (const row of rows) store.put(cacheRow(row));
    await cacheDone(tx);
  } catch (_) { /* 缓存失败不影响在线数据 */ }
}
async function cachePutState(db) {
  if (!db) return;
  try {
    const tx = db.transaction(CACHE_META, "readwrite");
    tx.objectStore(CACHE_META).put({
      k: CACHE_META_KEY, instanceId: S.instanceId, seq: Number(S.since || 0),
      username: S.username || "", savedAt: S.lastSyncAt || Date.now(),
    });
    await cacheDone(tx);
  } catch (_) {}
}
async function cacheClear(db) {
  if (!db) return;
  try {
    const tx = db.transaction([CACHE_RECORDS, CACHE_META], "readwrite");
    tx.objectStore(CACHE_RECORDS).clear();
    tx.objectStore(CACHE_META).clear();
    await cacheDone(tx);
  } catch (_) {}
}

/** 启动时把缓存灌回内存；账号不匹配就丢弃。返回是否真的用上了缓存。 */
async function loadCachedSnapshot() {
  S.cacheDb = await cacheOpen();
  const cached = await cacheLoad(S.cacheDb);
  if (!cached || !cached.meta || !S.token) return false;
  if (cached.meta.username && cached.meta.username !== S.username) {
    await cacheClear(S.cacheDb);
    return false;
  }
  S.records.clear();
  for (const row of cached.rows) {
    if (!row || !row.collection || !row.key) continue;
    S.records.set(rk(row.collection, row.key), {
      collection: row.collection, key: row.key, data: row.data,
      seq: Number(row.seq || 0), deleted: !!row.deleted,
    });
  }
  S.instanceId = String(cached.meta.instanceId || "");
  S.since = Number(cached.meta.seq || 0);
  S.lastSyncAt = Number(cached.meta.savedAt || 0) || null;
  return true;
}

/** 小并发上限的 map，避免 14 个集合同时打满浏览器连接数。 */
async function mapLimit(items, limit, fn) {
  let index = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (index < items.length) await fn(items[index++]);
  });
  await Promise.all(workers);
}

function adopt(ch) {
  let data = null;
  try { data = JSON.parse(ch.payload); } catch (_) { return null; }
  const row = {
    collection: ch.collection, key: ch.key, data, seq: Number(ch.seq || 0), deleted: !!ch.deleted,
  };
  S.records.set(rk(ch.collection, ch.key), row);
  return row;
}

/** 从 since 起拉增量；返回落地记录和新的水位。 */
async function pullChanges(startSince) {
  let since = startSince || 0, guard = 0, lastSeq = since, resetRequired = false, truncated = false;
  const changed = [];
  for (;;) {
    const r = await api(`/v1/pull?since=${since}&limit=200&includeSelf=1`);
    if (!r) break;
    resetRequired = resetRequired || !!r.resetRequired;
    for (const ch of r.changes || []) {
      const row = adopt(ch);
      if (row) changed.push(row);
    }
    lastSeq = Number(r.scannedSeq || r.lastSeq || lastSeq);
    if (!r.hasMore) break;
    if (++guard >= MAX_PULL_PAGES) { truncated = true; break; }
    since = lastSeq;
  }
  return { changed, lastSeq, resetRequired, truncated };
}

/**
 * 首次/重建：按集合拉「当前活数据」快照。各集合并行，谁先到谁先渲染，
 * 不再让首屏等一整条全局序号流。`upTo` 钉住一个一致点，之后用增量补齐。
 */
async function pullSnapshot(meta) {
  const snapshotSeq = Number(meta.seq || 0);
  const names = (meta.collections || []).map((c) => c && c.collection).filter(Boolean);
  const list = names.length ? [...new Set(names)] : Object.values(COLL);
  const changed = [];
  await mapLimit(list, 4, async (collection) => {
    let cursor = 0, guard = 0;
    for (;;) {
      const r = await api(`/v1/snapshot?collection=${encodeURIComponent(collection)}` +
        `&cursor=${cursor}&upTo=${snapshotSeq}&limit=${SNAPSHOT_LIMIT}`);
      if (!r) return;
      for (const ch of r.changes || []) {
        const row = adopt(ch);
        if (row) changed.push(row);
      }
      if (r.done || Number(r.nextCursor) <= cursor) break;
      cursor = Number(r.nextCursor);
      if (++guard >= 200) break;
    }
    // 一个集合到手就先画出来；用户正在输入时不重绘，避免吞掉半截文字。
    if (!isEditingPage()) render();
  });
  return { changed, snapshotSeq };
}

function isEditingPage() {
  const a = document.activeElement;
  return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !!a.closest("#view");
}

async function syncNow(quiet) {
  if (S.syncing || !S.token) return;
  S.syncing = true; renderTopbar();
  let changed = [], truncated = false;
  try {
    // /v1/meta 只是轻量探测：序号没变时，后台同步连一行业务数据都不拉。
    let meta = null;
    try { meta = await api("/v1/meta"); } catch (_) { meta = null; }

    if (!meta) {
      // 旧服务端没有 /v1/meta：退回原来的增量/全量拉取，保证还能用。
      const inc = await pullChanges(S.since || 0);
      changed = inc.changed;
      truncated = inc.truncated;
      S.since = inc.lastSeq;
    } else {
      const seq = Number(meta.seq || 0);
      const instanceId = String(meta.instanceId || "");
      if (!instanceId) {
        // 旧库还没执行新 schema：没有实例标识，也没有快照接口，保持纯增量。
        const inc = await pullChanges(S.since || 0);
        changed = inc.changed;
        truncated = inc.truncated;
        S.since = inc.lastSeq;
      } else {
      const instanceChanged = !!S.instanceId && !!instanceId && instanceId !== S.instanceId;
      const needSnapshot = !S.instanceId || instanceChanged || S.since > seq || (S.since === 0 && seq > 0);

      if (needSnapshot) {
        if (!S.instanceId || instanceChanged) {
          // 新会话 / 服务端换了库：旧缓存全部作废，重新从服务端快照建立视图。
          S.records.clear();
          S.since = 0;
          await cacheClear(S.cacheDb);
        }
        S.instanceId = instanceId;
        if (seq === 0) {
          // 空库：没有快照可拉。若缓存里还有旧数据，以服务端为准清掉。
          if (S.records.size) { S.records.clear(); await cacheClear(S.cacheDb); }
          S.since = 0;
        } else {
          // 只有真正要拉快照时才请求集合统计；日常 /v1/meta 不碰 records。
          const snapshotMeta = await api("/v1/meta?collections=1").catch(() => meta);
          const snap = await pullSnapshot(snapshotMeta);
          S.since = snap.snapshotSeq;
          changed = changed.concat(snap.changed);
          // 快照期间其他设备/本页写入的变化，用增量补齐到当前序号。
          const inc = await pullChanges(snap.snapshotSeq);
          changed = changed.concat(inc.changed);
          S.since = inc.lastSeq;
          truncated = inc.truncated;
        }
      } else if (seq !== S.since) {
        const inc = await pullChanges(S.since);
        if (inc.resetRequired) {
          S.records.clear();
          await cacheClear(S.cacheDb);
          S.instanceId = instanceId;
          S.since = 0;
          const snapshotMeta = await api("/v1/meta?collections=1").catch(() => meta);
          const snap = await pullSnapshot(snapshotMeta);
          changed = changed.concat(snap.changed);
          const inc2 = await pullChanges(snap.snapshotSeq);
          changed = changed.concat(inc2.changed);
          S.since = inc2.lastSeq;
          truncated = inc2.truncated;
        } else {
          changed = inc.changed;
          S.since = inc.lastSeq;
          truncated = inc.truncated;
        }
      }
      }
      // seq 没变：一行业务数据都不拉，只刷新“上次同步”。
    }

    S.lastSyncAt = Date.now();
    await cachePutRecords(S.cacheDb, changed);
    await cachePutState(S.cacheDb);
    // 冲突数只在用户主动同步时查一次；后台同步不再为它多跑一个全表 GROUP BY。
    if (!quiet) {
      const st = await api("/v1/stats").catch(() => null);
      if (st) S.conflictCount = Number(st.conflictCount || 0);
      const pulled = changed.length;
      snack(truncated
        ? `同步完成 · 拉取 ${pulled} 条，还有更多变更，请再同步一次`
        : pulled ? `同步完成 · 拉取 ${pulled} 条变更` : "已是最新");
    }
  } catch (e) {
    if (!quiet) snack("同步失败：" + e.message);
  } finally {
    S.syncing = false;
    if (isEditingPage()) renderTopbar(); else render();
  }
}

/**
 * 整条回写：把改动合并进原载荷后推上去。
 * baseSeq 取自本机见到这条时的服务端序号；服务端发现有人在这之后改过会报冲突，
 * 此时把服务端那一版采纳到本机并提示用户重新编辑（绝不静默覆盖）。
 */
async function commit(collection, key, mutate, options = {}) {
  const existing = S.records.get(rk(collection, key));
  const base = existing ? JSON.parse(JSON.stringify(existing.data)) : {};
  const payload = mutate(base) || base;
  payload.updatedAt = Date.now();
  if (!payload.syncId) payload.syncId = key;
  const deleted = options.deleted !== undefined ? !!options.deleted : recordDeleted(payload);
  const baseSeq = existing ? existing.seq : 0;

  const r = await api("/v1/push", {
    method: "POST",
    body: { changes: [{ collection, key, payload: JSON.stringify(payload), baseSeq, deleted }] },
  });
  const conflicts = (r && r.conflicts) || [];
  if (conflicts.length) {
    const c = conflicts[0];
    const row = adopt({ collection: c.collection, key: c.key, payload: c.payload, seq: c.seq, deleted: c.deleted });
    if (row) cachePutRecords(S.cacheDb, [row]);
    render();
    throw new Error("这条记录刚在别的设备上改过，已换成最新版本，请重新修改一次");
  }
  const applied = (r && r.applied && r.applied[0]) || null;
  const written = {
    collection, key, data: payload, seq: applied ? Number(applied.seq) : baseSeq + 1, deleted,
  };
  S.records.set(rk(collection, key), written);
  cachePutRecords(S.cacheDb, [written]);
  render();
  return payload;
}

/** 软删除：写墓碑而不是物理删，另一台设备据此同步删除。 */
const softDelete = (collection, key) =>
  commit(collection, key, (d) => { d.deletedAt = Date.now(); d.purgedAt = null; return d; }, { deleted: true });

/** 撤销软删除：把墓碑清掉，同一条记录复活。 */
const unDelete = (collection, key) =>
  commit(collection, key, (d) => { d.deletedAt = null; d.purgedAt = null; return d; }, { deleted: false });

/* ------------------------------------------------------- 新记录构造器 */

function nextId(collection) {
  let max = 0;
  for (const r of allOf(collection)) max = Math.max(max, Number(r.data.id || 0));
  return max + 1;
}
const stamp = () => ({ id: 0, syncId: uuid(), updatedAt: Date.now(), deletedAt: null });

/** 新载荷一律带齐「无默认值」的必填字段，安卓端 decode 才不会整条失败。 */
function blank(collection, fields) {

  let d;

      break;
    case COLL.ITEMS:

        quantity: 1, consumedQuantity: 0, unit: "件", price: null, expireTime: null,
        status: null, usageStatus: USAGE.IN_USE, disposition: DISPO.IN_STOCK, needRestock: false,
        purchaseDate: null, productionDate: null, startUseTime: null, usageEndedAt: null,
        trackMode: 0, forWhom: null, reminderDays: null, rating: null, ratedAt: null,
        purgedAt: null, note: "", imageHashes: null, deletedAt: null,
        createdAt: now, syncId: null, categorySyncId: null, locationSyncId: null, updatedAt: now,
      };
      break;
    case COLL.ASSETS:
      d = { id: 0, name: "", icon: "💳", sort: 0, initialBalance: 0, type: 0, syncId: null, updatedAt: now, deletedAt: null };
      break;
    case COLL.LEDGER_CATS:
      d = { id: 0, name: "", icon: "🧾", kind: 0, sort: 0, parentId: null, isProtected: false, syncId: null, updatedAt: now, deletedAt: null };
      break;
    case COLL.LEDGER:
      d = {
        id: 0, type: 0, amount: 0, categoryId: null, assetId: null, targetAssetId: null,
        recordTime: now, remark: "", itemId: null, createdAt: now, syncId: null,
        categorySyncId: null, assetSyncId: null, targetAssetSyncId: null, itemSyncId: null,
        updatedAt: now, deletedAt: null,
      };
      break;
    case COLL.BUDGETS:
      d = { id: 0, categoryId: null, categorySyncId: null, amount: 0, period: "monthly", syncId: null, updatedAt: now, deletedAt: null };
      break;
    case COLL.ANNIVERSARIES:
      d = {
        id: 0, name: "", note: "", type: 0, date: dayKey(now), isLunar: false, lunarMonth: 0, lunarDay: 0,
        repeatUnit: "YEAR", repeatInterval: 1, remindDays: "", enabled: true, createdAt: now,
        syncId: null, updatedAt: now, deletedAt: null,
      };
      break;
    case COLL.REMINDERS:
      d = {
        id: 0, title: "", note: "", repeatType: "ONCE", intervalDays: 1, weekdays: "", fireTime: "19:00",
        targetDate: dayKey(now), nextFireAt: 0, enabled: true, completedAt: null, source: "MANUAL",
        sourceKey: null, doseTimes: "", courseStartDate: null, courseDays: 0, linkedItemId: null,
        itemSyncId: null, purgedAt: null, createdAt: now, syncId: null, updatedAt: now, deletedAt: null,
      };
      break;
    case COLL.CAPSULES:
      d = { id: 0, title: "", content: "", unlockAt: now + 86400000, openedAt: null, forWhom: null, createdAt: now, syncId: null, updatedAt: now, deletedAt: null };
      break;
    case COLL.TRIPS:
      d = { id: 0, name: "", destination: "", startDate: null, endDate: null, createdAt: now, syncId: null, updatedAt: now, deletedAt: null };
      break;
    case COLL.PACK_ITEMS:
      d = { id: 0, tripId: 0, name: "", quantity: 1, category: "", checked: false, sort: 0, createdAt: now, syncId: null, updatedAt: now, deletedAt: null, tripSyncId: null };
      break;
    case COLL.TEMPLATES:
      d = { id: 0, name: "", type: 0, amount: 0, categoryId: null, assetId: null, targetAssetId: null, remark: "", sort: 0, createdAt: now, syncId: null, categorySyncId: null, assetSyncId: null, targetAssetSyncId: null, updatedAt: now, deletedAt: null };
      break;
    case COLL.RULES:
      d = { id: 0, name: "", type: 0, amount: 0, categoryId: null, assetId: null, targetAssetId: null, remark: "", repeatUnit: "MONTH", repeatInterval: 1, nextFireAt: now, lastFiredAt: null, enabled: true, createdAt: now, syncId: null, categorySyncId: null, assetSyncId: null, targetAssetSyncId: null, updatedAt: now, deletedAt: null };
      break;
    default:
      d = { ...stamp() };
  }
  d.id = nextId(collection);
  d.syncId = uuid();
  Object.assign(d, fields || {});
  return d;
}

/**
 * 新建一条记录并推上服务端。
 * 只在服务端确实收下之后才登记进本机视图——否则推送失败会在列表里留下
 * 一条只存在于浏览器、云端根本没有的「幽灵记录」。
 */
async function create(collection, fields, keyOf) {
  const data = blank(collection, fields);
  const key = keyOf ? keyOf(data) : data.syncId;
  data.syncId = key;
  const r = await api("/v1/push", {
    method: "POST",
    body: { changes: [{ collection, key, payload: JSON.stringify(data), baseSeq: 0, deleted: false }] },
  });
  const conflicts = (r && r.conflicts) || [];
  if (conflicts.length) {
    const c = conflicts[0];
    // 极罕见（同一条刚被别的设备建过）：采纳服务端版本并如实告知，不静默丢弃。
    const row = adopt({ collection: c.collection, key: c.key, payload: c.payload, seq: c.seq, deleted: c.deleted });
    if (row) cachePutRecords(S.cacheDb, [row]);
    render();
    throw new Error("这条记录刚在别的设备上建过，已换成最新版本");
  }
  const applied = (r && r.applied && r.applied[0]) || null;
  const written = {
    collection, key, data, seq: applied ? Number(applied.seq) : 0, deleted: false,
  };
  S.records.set(rk(collection, key), written);
  cachePutRecords(S.cacheDb, [written]);
  render();
  return data;
}

/* ------------------------------------------------------------------ 提示 */

let snackTimer = null;
function snack(text, undo) {
  const box = h("div", { class: "snack" }, h("span", { text }));
  if (undo) box.append(h("button", { text: "撤销", onClick: async () => { box.remove(); await undo(); } }));
  else box.append(h("button", { text: "知道了", onClick: () => box.remove() }));
  document.body.append(box);
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => box.remove(), undo ? 7000 : 3200);
}

function busyRun(fn) {
  return async (...args) => {
    if (S.busy) return;
    S.busy = true; render();
    const done = (msg, undo) => { if (msg) snack(msg, undo); };
    try { const r = await fn(...args); done(r && r.msg, r && r.undo); }
    catch (e) { snack(e && e.message ? e.message : "操作没成功，请再试一次"); }
    finally { S.busy = false; render(); }
  };
}

/* -------------------------------------------------------------- 浮层 UI */

function sheet(title, desc, bodyBuilder, actions) {
  const host = $("overlay");
  const close = () => { host.innerHTML = ""; };
  const panel = h("div", { class: "sheet" }, h("h3", { text: title }));
  if (desc) panel.append(h("div", { class: "desc", text: desc }));
  const body = h("div");
  panel.append(body);
  bodyBuilder(body, close);
  if (actions) {
    const bar = h("div", { class: "sheet-actions" });
    for (const a of actions) bar.append(a(close));
    panel.append(bar);
  }
  const scrim = h("div", { class: "scrim", onClick: (e) => { if (e.target === scrim) close(); } }, panel);
  host.innerHTML = "";
  host.append(scrim);
  return close;
}

function field(label, input) {
  return h("label", { class: "f" }, h("span", { text: label }), input);
}
function textInput(value, placeholder, type) {
  return h("input", { type: type || "text", value: value ?? "", placeholder: placeholder || "", inputmode: type === "number" ? "decimal" : null });
}
function selectInput(options, value) {
  const sel = h("select");
  for (const [v, label] of options) {
    const o = h("option", { value: v, text: label });
    if (String(v) === String(value)) o.selected = true;
    sel.append(o);
  }
  return sel;
}
function chipGroup(entries, value, onPick, plain) {
  const wrap = h("div", { class: "seg" });
  let current = value;
  const paint = () => {
    [...wrap.children].forEach((c) => c.classList.toggle("on", c.dataset.v === String(current)));
  };
  for (const [v, label] of entries) {
    wrap.append(h("button", {
      class: "chip" + (plain ? " plain" : ""), "data-v": v, text: label,
      onClick: () => { current = v; paint(); onPick(v); },
    }));
  }
  paint();
  return { node: wrap, get: () => current };
}

/* --------------------------------------------------------------- 视图层 */

function categoriesOf() {
  return liveOf(COLL.CATEGORIES).sort((a, b) => String(a.data.name).localeCompare(String(b.data.name), "zh"));
}
function locationsOf() {
  return liveOf(COLL.LOCATIONS).sort((a, b) => String(a.data.name).localeCompare(String(b.data.name), "zh"));
}
function assetsOf() { return liveOf(COLL.ASSETS).sort((a, b) => (a.data.sort || 0) - (b.data.sort || 0)); }
function ledgerCatsOf(kind) {
  return liveOf(COLL.LEDGER_CATS)
    .filter((r) => Number(r.data.kind || 0) === kind)
    .sort((a, b) => (a.data.sort || 0) - (b.data.sort || 0));
}
function nameOf(collection, syncId) {
  if (!syncId) return "";
  for (const r of allOf(collection)) if (r.data.syncId === syncId && !recordDeleted(r.data)) return r.data.name || "";
  return "";
}
function itemsOf() {
  return liveOf(COLL.ITEMS).sort((a, b) => {
    const ea = a.data.expireTime, eb = b.data.expireTime;
    if (ea && eb) return ea - eb;
    if (ea) return -1;
    if (eb) return 1;
    return (b.data.createdAt || 0) - (a.data.createdAt || 0);
  });
}

/* ---- 家当 ---- */
function viewItems(root) {
  root.append(h("h2", { class: "sect", text: "家当" }));
  const all = itemsOf();
  const search = textInput("", "搜索名称、分类或位置");

  const metaOf = (r) => [nameOf(COLL.CATEGORIES, r.data.categorySyncId), nameOf(COLL.LOCATIONS, r.data.locationSyncId)].filter(Boolean).join(" · ");
  const paint = () => {
    const q = search.value.trim().toLowerCase();

      ? all.filter((r) => `${r.data.name || ""} ${metaOf(r)}`.toLowerCase().includes(q))

    // 与安卓家当页同口径：件数与估值只算真正在库的东西，待买项不计入资产。
    const owned = all.filter((r) => !(r.data.needRestock && r.data.usageStatus === USAGE.USED_UP));
    const value = owned.reduce((sum, r) => sum + (Number(r.data.price) || 0) * Math.max(0, Number(r.data.quantity) || 0), 0);
    summary.textContent = all.length
      ? `在库 ${owned.length} 件 · 估值 ¥${yuan(Math.round(value * 100))}`
      : "";
    list.innerHTML = "";
    if (!items.length) {
      list.append(all.length
        ? emptyCard("🔎", "没有找到匹配物品", "换个名称、分类或位置关键词试试。")
        : emptyCard("🧺", "还没有家当", "点右下角「＋」录入第一件东西；录入后两台设备都会看到。"));
      return;
    }
    const card = h("div", { class: "card" });
    for (const r of items) {
      const d = r.data;
      const isToBuy = d.needRestock && d.usageStatus === USAGE.USED_UP;
      const bits = [];
      const meta = metaOf(r);
      if (meta) bits.push(meta);
      if (d.trackMode === 0) bits.push(isToBuy ? `想买 ${d.quantity}${d.unit || ""}` : `${d.quantity}${d.unit || ""}`);
      const days = d.expireTime ? daysUntil(d.expireTime) : null;
      const badges = [];
      if (d.needRestock) badges.push(["brand", "要补货"]);
      if (days !== null) badges.push([days < 0 ? "warn" : "", days < 0 ? `过期 ${-days} 天` : days === 0 ? "今天到期" : `${days} 天后到期`]);
      if (!isToBuy && d.usageStatus === USAGE.USED_UP) badges.push(["", "已用完"]);
      card.append(h("div", { class: "row", onClick: () => (isToBuy ? toBuySheet(r) : itemSheet(r)) },
        h("div", { class: "ico", text: "🧺" }),
        h("div", { class: "grow" },
          h("div", { class: "t", text: d.name || "未命名" }),
          h("div", { class: "s", text: bits.join(" · ") || "未归类" }),
          badges.length ? h("div", { style: "margin-top:5px;display:flex;gap:6px;flex-wrap:wrap" },
            badges.map(([k, t]) => h("span", { class: "pill " + k, text: t }))) : null),
        h("div", { class: "chev", text: "›" })));
    }
    list.append(card);
  };
  search.oninput = paint;
  paint();
}

/* ---- 记账 ---- */
function viewLedger(root) {
  const recs = liveOf(COLL.LEDGER).sort((a, b) => (b.data.recordTime || 0) - (a.data.recordTime || 0));
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);
  let income = 0, expense = 0;
  for (const r of recs) {
    if ((r.data.recordTime || 0) < monthStart.getTime()) continue;
    if (Number(r.data.type) === 0) expense += Number(r.data.amount || 0);
    if (Number(r.data.type) === 1) income += Number(r.data.amount || 0);
  }
  root.append(h("h2", { class: "sect", text: "记账 · 本月" }));
  root.append(h("div", { class: "card pad" },
    h("div", { style: "display:flex;gap:18px" },
      h("div", {}, h("div", { class: "small muted", text: "支出" }), h("div", { style: "font-size:20px;font-weight:700", text: "¥" + yuan(expense) })),
      h("div", {}, h("div", { class: "small muted", text: "收入" }), h("div", { style: "font-size:20px;font-weight:700;color:var(--brand)", text: "¥" + yuan(income) })),
      h("div", {}, h("div", { class: "small muted", text: "结余" }), h("div", { style: "font-size:20px;font-weight:700", text: "¥" + yuan(income - expense) })))));

  root.append(h("h2", { class: "sect", text: "最近记录" }));
  if (!recs.length) {
    root.append(emptyCard("🧾", "还没有记账", "点右下角「＋」记一笔；金额按分存储，两端算出来的一致。"));
    return;
  }
  const card = h("div", { class: "card" });
  for (const r of recs.slice(0, S.ledgerLimit)) {
    const d = r.data;
    const t = Number(d.type);
    const cat = nameOf(COLL.LEDGER_CATS, d.categorySyncId);
    const asset = nameOf(COLL.ASSETS, d.assetSyncId);
    const sub = [t === 2 ? `转账 → ${nameOf(COLL.ASSETS, d.targetAssetSyncId) || "?"}` : cat, asset, d.remark].filter(Boolean).join(" · ");
    card.append(h("div", { class: "row", onClick: () => ledgerSheet(r) },
      h("div", { class: "ico", text: t === 0 ? "💸" : t === 1 ? "💰" : "🔄" }),
      h("div", { class: "grow" },
        h("div", { class: "t", text: (t === 1 ? "+" : t === 0 ? "−" : "") + "¥" + yuan(d.amount) }),
        h("div", { class: "s", text: `${LEDGER_TYPE[t] || "记账"} · ${fmtTime(d.recordTime)}  ${sub}` })),
      h("div", { class: "chev", text: "›" })));
  }
  if (recs.length > S.ledgerLimit) {
    card.append(h("div", { class: "row", style: "justify-content:center", onClick: () => { S.ledgerLimit += 60; render(); } },
      h("div", { class: "grow", style: "text-align:center;color:var(--brand);font-weight:600",
        text: `显示更多（还有 ${recs.length - S.ledgerLimit} 条）` })));
  }
  root.append(card);
}

function ledgerSheet(r) {
  const d = r ? r.data : blank(COLL.LEDGER);
  sheet(r ? "编辑这一笔" : "记一笔", null, (body, close) => {
    let type = Number(d.type || 0);
    const amount = textInput(d.amount ? yuan(d.amount) : "", "0.00", "number");
    const when = h("input", { type: "date", value: dayKey(d.recordTime || Date.now()) });
    const remark = textInput(d.remark || "", "备注（可空）");
    const helper = h("div");
    body.append(
      chipGroup([[0, "支出"], [1, "收入"], [2, "转账"]], type, (v) => { type = Number(v); paintFields(); }).node,
      field("金额（元）", amount),
      helper,
      field("日期", when),
      field("备注", remark)
    );
    const catSel = { value: d.categorySyncId || "" };
    const assetSel = { value: d.assetSyncId || "" };
    const targetSel = { value: d.targetAssetSyncId || "" };
    function paintFields() {
      helper.innerHTML = "";
      const assets = assetsOf();
      const assetOptions = [["", "不指定账户"], ...assets.map((x) => [x.data.syncId, x.data.name])];
      if (type === 2) {
        helper.append(
          field("从（转出账户）", (() => { const s = selectInput(assetOptions, assetSel.value); s.onchange = () => (assetSel.value = s.value); return s; })()),
          field("到（转入账户）", (() => { const s = selectInput(assetOptions, targetSel.value); s.onchange = () => (targetSel.value = s.value); return s; })()));
      } else {
        helper.append(
          field("分类", (() => { const s = selectInput([["", "未分类"], ...ledgerCatsOf(type).map((x) => [x.data.syncId, x.data.name])], catSel.value); s.onchange = () => (catSel.value = s.value); return s; })()),
          field("账户", (() => { const s = selectInput(assetOptions, assetSel.value); s.onchange = () => (assetSel.value = s.value); return s; })()));
      }
    }
    paintFields();
    body.append(h("div", { class: "sheet-actions" },
      h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存", disabled: S.busy, onClick: busyRun(async () => {
        const cents = toCents(amount.value);
        if (cents <= 0) throw new Error("金额要大于 0");
        const fields = {
          type, amount: cents, recordTime: when.value ? dayStart(when.value) : Date.now(),
          remark: remark.value, categorySyncId: type === 2 ? null : (catSel.value || null),
          assetSyncId: assetSel.value || null, targetAssetSyncId: type === 2 ? (targetSel.value || null) : null,
        };
        if (r) {
          await commit(COLL.LEDGER, r.key, (p) => { Object.assign(p, fields); return p; });
        } else {
          const data = blank(COLL.LEDGER, fields);
          await create(COLL.LEDGER, data, () => data.syncId);
        }
        close();
        return { msg: "已记账" };
      }) }),
      r ? h("button", { class: "btn danger", text: "删除", onClick: busyRun(async () => {
        close(); await softDelete(COLL.LEDGER, r.key);
        return { msg: "已删除这一笔", undo: () => unDelete(COLL.LEDGER, r.key).then(() => snack("已恢复")) };
      }) }) : h("button", { class: "btn", text: "取消", onClick: close })));
  });
}

  const c1 = h("div", { class: "card" });
  for (const r of need) {
    const cat = nameOf(COLL.CATEGORIES, r.data.categorySyncId);
    c1.append(h("div", { class: "row", onClick: () => toBuySheet(r) },

        h("div", { class: "s", text: [cat, r.data.forWhom ? FOR_WHOM[r.data.forWhom] : ""].filter(Boolean).join(" · ") || "待补货" })),
      h("button", { class: "btn sm ghost", text: "已买到", onClick: (e) => { e.stopPropagation(); bought(r); } })));
  }

function bought(r) {
  const prev = {
    needRestock: r.data.needRestock, quantity: r.data.quantity,
    usageStatus: r.data.usageStatus, purchaseDate: r.data.purchaseDate,
    startUseTime: r.data.startUseTime, usageEndedAt: r.data.usageEndedAt,
  };
  busyRun(async () => {
    await commit(COLL.ITEMS, r.key, (p) => {
      p.needRestock = false;
      p.quantity = Math.max(1, Number(p.quantity) || 1);
      // 与安卓 restoreToInUse 对齐：买到后回到「使用中」并记下购买日，
      // 否则它只会从待买消失、却仍以「已用完」留在库里。
      p.usageStatus = USAGE.IN_USE;
      p.purchaseDate = Date.now();
      p.startUseTime = Date.now();
      p.usageEndedAt = null;
      return p;
    });
    return {
      msg: `「${r.data.name}」已标记买到`,
      // 硬规则：已买到必须可撤销。
      undo: () => commit(COLL.ITEMS, r.key, (p) => {
        p.needRestock = prev.needRestock;
        p.quantity = prev.quantity;
        p.usageStatus = prev.usageStatus;
        p.purchaseDate = prev.purchaseDate;
        p.startUseTime = prev.startUseTime;
        p.usageEndedAt = prev.usageEndedAt;
        return p;
      }).then(() => snack("已撤销")),
    };
  })();
}
function markNeed(r) {
  busyRun(async () => {
    await commit(COLL.ITEMS, r.key, (p) => { p.needRestock = true; return p; });
    return {
      msg: `「${r.data.name}」已加入要买的`,
      undo: () => commit(COLL.ITEMS, r.key, (p) => { p.needRestock = false; return p; }).then(() => snack("已撤销")),
    };
  })();
}

        const nextAt = nextFireFor(
          { repeatType: r ? (d.repeatType || "ONCE") : "ONCE", intervalDays: d.intervalDays },
          date.value || dayKey(Date.now()), time.value.trim()
        );
        if (nextAt <= Date.now()) throw new Error("这个提醒时间已经过去了，请改成未来的时间");
        const fields = {
          title: title.value.trim(), targetDate: date.value || dayKey(Date.now()),

        };
        // 编辑已有周期提醒时不写 repeatType：旧实现无条件写 ONCE，会把「每周浇花」静默变成一次性。
        if (!r) fields.repeatType = "ONCE";

      }) }) : h("button", { class: "btn", text: "取消", onClick: close })));
  });
}
const hhmm = (s) => { const [hh, mm] = s.split(":").map(Number); return ((hh || 0) * 3600 + (mm || 0) * 60) * 1000; };

/**
 * 周期提醒的「下一次」必须落在未来。只改日期/时间时，如果算出来已经过去，
 * 按频率往后推（每天 +1 天、每周 +7 天、隔几天 +intervalDays），
 * 否则页面会显示「下次 09:00」却是今天早上已经过去的时间，手机端也不会再响。
 */
function nextFireFor(d, dateStr, timeStr) {
  const base = dayStart(dateStr) + hhmm(timeStr);
  const type = d.repeatType || "ONCE";
  if (type === "ONCE" || base > Date.now()) return base;
  const stepDays = type === "INTERVAL" ? Math.max(1, Number(d.intervalDays) || 1) : type === "WEEKLY" ? 7 : 1;
  let next = base;
  while (next <= Date.now()) next += stepDays * 86400000;
  return next;
}

  a.append(h("div", { class: "row", onClick: () => assetSheet(null) },

  cats.append(h("div", { class: "row", onClick: () => ledgerCatSheet(null) },

    h("div", { class: "chev", text: "›" })));
  hc.append(h("div", { class: "row", onClick: () => categorySheet(null) },

/**
 * 家庭设置：直接编辑 preferences 记录。
 *
 * 与 App 共用同一条服务端记录；保存后 App 下一次增量拉取即可看到。
 * 只覆盖表单里给出的字段，菜谱库/周菜单等结构化内容保持原样。
 */
function viewSettings(root) {
  const rec = S.records.get(rk(COLL.PREFERENCES, PREF_KEY));
  const d = rec ? rec.data : {};
  root.append(h("h2", { class: "sect", text: "家庭设置" }));
  const card = h("div", { class: "card pad" });
  card.append(h("div", { class: "small muted", style: "margin-bottom:10px", text:
    "与 App 共用同一条 preferences 记录；保存后打开 App 同步即可生效。菜谱库、周菜单等结构化内容请在 App 内修改。" }));
  const nickname = textInput(d.nickname || "", "例如：小柠檬");
  const times = textInput((d.reminderTimes || []).join(", "), "08:00, 19:00");
  const ladder = textInput((d.reminderLadder || []).join(", "), "1, 3, 7, 14, 30");
  const monthStart = textInput(String(d.ledgerMonthStartDay || 1), "1-28", "number");
  const mealDays = textInput(String(d.mealPlanDays || 7), "1-30", "number");
  const budget = chipGroup([[1, "开启"], [0, "关闭"]], d.budgetReminderEnabled ? 1 : 0, () => {});
  card.append(
    field("昵称", nickname),
    field("每日提醒时间（留空表示关闭到期提醒）", times),
    field("到期提醒阶梯（天，逗号分隔）", ladder),
    field("记账月起始日（1-28）", monthStart),
    field("未来菜单天数（1-30）", mealDays),
    field("预算超支提醒", budget.node)
  );
  card.append(h("div", { class: "sheet-actions" },
    h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存设置", disabled: S.busy, onClick: busyRun(async () => {
      const parse = (v) => String(v).split(/[,，\s]+/).map((x) => x.trim()).filter(Boolean);
      const timesList = parse(times.value);
      if (timesList.some((t) => !/^\d{1,2}:\d{2}$/.test(t))) throw new Error("提醒时间格式应为 HH:mm");
      const ladderList = parse(ladder.value).map(Number).filter((n) => Number.isFinite(n) && n > 0);
      const start = Number(monthStart.value);
      if (!Number.isInteger(start) || start < 1 || start > 28) throw new Error("记账月起始日需在 1-28");
      const days = Number(mealDays.value);
      if (!Number.isInteger(days) || days < 1 || days > 30) throw new Error("菜单天数需在 1-30");
      const fields = {
        nickname: nickname.value.trim() || null,
        reminderTimes: timesList,
        reminderLadder: ladderList,
        ledgerMonthStartDay: start,
        mealPlanDays: days,
        budgetReminderEnabled: Number(budget.get()) === 1,
      };
      await commit(COLL.PREFERENCES, PREF_KEY, (p) => { Object.assign(p, fields); return p; });
      return { msg: "设置已保存，打开 App 同步后生效" };
    }) })));
  root.append(card);
}

function assetSheet(r) {
  const d = r ? r.data : blank(COLL.ASSETS);
  sheet(r ? "账户" : "新增账户", null, (body, close) => {
    const name = textInput(d.name || "", "例如：招行储蓄卡");
    const icon = textInput(d.icon || "💳", "图标（一个 emoji）");
    const balance = textInput(d.initialBalance ? yuan(d.initialBalance) : "0", "0", "number");
    body.append(field("名称", name), field("图标", icon), field("初始余额（元）", balance));
    body.append(h("div", { class: "sheet-actions" },
      h("button", { class: "btn primary", text: S.busy ? "保存中…" : "保存", disabled: S.busy, onClick: busyRun(async () => {
        if (!name.value.trim()) throw new Error("名称不能为空");
        const fields = { name: name.value.trim(), icon: icon.value.trim() || "💳", initialBalance: toCents(balance.value) };
        if (r) await commit(COLL.ASSETS, r.key, (p) => { Object.assign(p, fields); return p; });
        else { const data = blank(COLL.ASSETS, fields); await create(COLL.ASSETS, data, () => data.syncId); }
        close(); return { msg: "已保存" };

      r ? h("button", { class: "btn danger", text: "删除", onClick: busyRun(async () => {
        close(); await softDelete(COLL.ASSETS, r.key);

function emptyCard(icon, title, sub) {
  return h("div", { class: "card empty" },
    h("div", { class: "big", text: icon }),

/* ------------------------------------------------------------- 登录视图 */

function viewLogin(root) {
  const card = h("div", { class: "card pad", style: "margin-top:40px" });
  card.append(
    h("div", { style: "font-size:22px;font-weight:700;margin-bottom:4px", text: "柠檬百宝箱 · 网页版" }),
    h("div", { class: "small muted", style: "margin-bottom:16px", html:
      "不用装 App、不用证书：用云端账号登录后，在浏览器里看与改家当、记账、待买、提醒、纪念日、胶囊、打包。" }));
  const user = textInput("", "账号");
  const pass = h("input", { type: "password", placeholder: "密码" });
  card.append(field("账号", user), field("密码", pass));
  const submit = h("button", { class: "btn primary block", text: "登录", style: "margin-top:6px",
    onClick: async () => {
      if (S.busy) return;
      if (!user.value.trim() || !pass.value) { snack("请输入账号和密码"); return; }
      // 不要在这里 render()：重建登录视图会把用户刚输入的账号密码一起清掉。
      // 直接改按钮状态，失败时保留输入。
      S.busy = true;
      submit.disabled = true;
      submit.textContent = "登录中…";
      try {
        const r = await api("/v1/login", { auth: false, method: "POST", body: {
          username: user.value.trim(), password: pass.value, deviceId: S.deviceId, deviceName: S.deviceName } });
        saveSession(r.token, (r.user && r.user.name) || user.value.trim(), r.expiresAt);
        pass.value = "";
        S.busy = false;
        render();
        snack("登录成功，正在同步云端数据…");
        // quiet=false：首次同步失败必须让用户看到原因，否则只会看到一屏空白。
        await syncNow(false);
      } catch (e) {
        snack(e && e.message ? e.message : "登录失败，请再试一次");
      } finally {
        S.busy = false;
        submit.disabled = false;
        submit.textContent = "登录";
      }
    } });
  card.append(submit);
  card.append(h("div", { class: "tiny muted", style: "margin-top:12px", html:
    "账号与云端由你自己搭建的同步服务管理；登录只换取一个会话令牌，密码不会留在浏览器里。" }));
  root.append(card);
}

/* --------------------------------------------------------------- 渲染 */

const TABS = [
  ["items", "🧺", "家当"],
  ["ledger", "🧾", "记账"],
  ["tobuy", "🛒", "待买"],
  ["reminders", "⏰", "提醒"],
  ["more", "⋯", "更多"],
];
const EXTRA_VIEWS = { anniversaries: "纪念日", capsules: "时间胶囊", packing: "打包清单", taxonomy: "账户与分类", settings: "家庭设置" };

function go(tab) {
  S.tab = tab;
  window.scrollTo({ top: 0 });
  render();
}

function renderTopbar() {
  const bar = $("topbar");
  bar.innerHTML = "";
  const inner = h("div", { class: "topbar-in" },
    h("div", { class: "logo", text: "🍋" }),
    h("div", null,
      h("h1", { text: "柠檬百宝箱" }),
      h("div", { class: "who", text: S.username ? `已登录 · ${S.username}` : "网页版" })));
  const actions = h("div", { class: "top-actions" });
  if (S.token) {
    actions.append(h("button", { class: "iconbtn", title: "同步", "aria-label": "同步", text: S.syncing ? "…" : "⟳",
      disabled: S.syncing || S.busy, onClick: () => syncNow(false) }));
  }
  inner.append(actions);
  bar.append(inner);
}

function renderTabbar() {
  const bar = $("tabbar");
  bar.innerHTML = "";
  if (!S.token) return;
  const inner = h("div", { class: "tabbar-in" });
  for (const [id, icon, label] of TABS) {
    const on = S.tab === id || (EXTRA_VIEWS[S.tab] && id === "more");
    inner.append(h("button", { class: "tab" + (on ? " on" : ""), onClick: () => go(id) },
      h("span", { class: "b", text: icon }), h("span", { text: label })));
  }
  bar.append(inner);
}

function render() {
  renderTopbar();
  renderTabbar();
  const root = $("view");
  root.innerHTML = "";
  if (!S.token) { viewLogin(root); return; }
  if (S.syncing && !S.records.size) {
    root.append(h("div", { class: "card pad center muted", style: "margin-top:40px" },
      h("div", { text: "正在同步云端数据…" }), h("div", { class: "bar" }, h("i", { style: "width:60%" }))));
    return;
  }
  switch (S.tab) {
    case "items": viewItems(root); break;
    case "ledger": viewLedger(root); break;
    case "tobuy": viewToBuy(root); break;
    case "reminders": viewReminders(root); break;
    case "anniversaries": viewAnniversaries(root); break;
    case "capsules": viewCapsules(root); break;
    case "packing": viewPacking(root); break;
    case "taxonomy": viewTaxonomy(root); break;
    case "settings": viewSettings(root); break;
    default: viewMore(root);
  }
  if (["items", "ledger", "more", "tobuy"].includes(S.tab)) addFab(root);
}

/** 悬浮「＋」：按当前栏目给对应的新建动作。 */
function addFab(root) {
  const fabFor = { items: newItemSheet, ledger: () => ledgerSheet(null), tobuy: newToBuySheet };
  const fn = fabFor[S.tab];
  if (!fn) return;
  const fab = h("button", {
    class: "fab", title: "新增",
    style: "position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;" +
      "width:54px;height:54px;border-radius:18px;border:0;cursor:pointer;font-size:26px;color:#3A2E10;" +
      "background:linear-gradient(135deg,var(--lemon),#F7D64A);box-shadow:var(--shadow)",
    text: "＋", onClick: fn,
  });
  document.body.append(fab);
}

/* ------------------------------------------------------------------ 启动 */

loadSession();
render();
(async () => {
  // 先读 IndexedDB 里的上一轮快照，立即把列表画出来；再向服务端要增量。
  const hadCache = await loadCachedSnapshot();
  if (hadCache) render();
  if (S.token) syncNow(true);
})();
window.addEventListener("focus", () => { if (S.token && !S.syncing && Date.now() - (S.lastSyncAt || 0) > 60000) syncNow(true); });
// 每次重渲染先清掉上一帧遗留的悬浮按钮。
const _render = render;
render = function () { document.querySelectorAll(".fab").forEach((n) => n.remove()); _render(); };
// 列表行是 div；让 Enter / Space 与点击等价（鼠标和读屏之外的键盘用户）。
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const target = e.target;
  const row = target && target.closest ? target.closest('.row[role="button"]') : null;
  if (!row) return;
  if (target !== row && target.closest("button")) return;
  e.preventDefault();
  row.click();
});
</script>
