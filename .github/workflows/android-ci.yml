name: Android CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest 已预装 Android SDK，直接用 sdkmanager 安装所需包即可。
      # 不使用 android-actions/setup-android@v3：其内部会执行 `sdkmanager tools`，
      # 在 cmdline-tools 16.0 下因 tools 包已下架而失败。
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Secrets 配齐时写入正式签名配置；缺失时 build.gradle.kts 自动回退 debug 签名
      - name: Prepare release signing
        env:
          LEMON_KEYSTORE_BASE64: ${{ secrets.LEMON_KEYSTORE_BASE64 }}
          LEMON_KEYSTORE_PASSWORD: ${{ secrets.LEMON_KEYSTORE_PASSWORD }}
          LEMON_KEY_ALIAS: ${{ secrets.LEMON_KEY_ALIAS }}
          LEMON_KEY_PASSWORD: ${{ secrets.LEMON_KEY_PASSWORD }}
        run: |
          if [ -n "$LEMON_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.gradle"
            echo "$LEMON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lemon-release.jks"
            {
              echo "LEMON_KEYSTORE_PATH=$RUNNER_TEMP/lemon-release.jks"
              echo "LEMON_KEYSTORE_PASSWORD=$LEMON_KEYSTORE_PASSWORD"
              echo "LEMON_KEY_ALIAS=$LEMON_KEY_ALIAS"
              echo "LEMON_KEY_PASSWORD=$LEMON_KEY_PASSWORD"
            } >> "$HOME/.gradle/gradle.properties"
            echo "release 签名：使用 Secrets 中的正式 keystore"
          else
            echo "release 签名：未检测到 keystore Secret，回退 debug 签名"
          fi

      - name: Run tests and builds
        run: ./gradlew test assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
