name: Deploy Worker

# 触发方式：推送 v* tag（与 Release APK 同一 tag，客户端与服务端版本同步锁定），
# 也可在 Actions 页手动触发（workflow_dispatch）。
# 前置：仓库 secret CLOUDFLARE_API_TOKEN（权限模板「编辑 Cloudflare Workers」，
# 建号入口：Cloudflare dashboard → My Profile → API Tokens）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy Worker (server/)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
