name: Release APK

# 触发方式：推送形如 v0.0.7 的 tag 时自动构建并发布。
# 版本号来源：versionName 取 tag（去掉前缀 v），versionCode 由 tag 推导，
# 保证与「检查更新」里对比的 GitHub tag 完全一致。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # 固定 24.04 而非 ubuntu-latest：latest 计划于 2026-11 迁往 Ubuntu 26，
    # 而本构建依赖的 android-35 与 build-tools 35.0.x 在 24.04 镜像上已验证齐备。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Point Gradle wrapper at official distribution
        # 本地开发走腾讯云镜像加速；CI 跑在 GitHub 美国节点，该镜像不可达且 networkTimeout 仅 10s，
        # 会导致 gradlew 下载 Gradle 分发包失败，故在 CI 内改用官方分发包。
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#networkTimeout=10000#networkTimeout=60000#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Verify Android SDK
        # ubuntu-24.04 runner 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
        # 且包含 platforms;android-35、build-tools;35.0.0、platform-tools，因此无需再调用
        # 已废弃的 sdkmanager，也不使用 android-actions/setup-android（其内部 sdkmanager tools 会失败）。
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          # 显式写入 local.properties，确保 Gradle 定位到 SDK。
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LEMON_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # v2 前缀用于作废此前可能已被污染的解析缓存（曾把插件误判为“不存在”）。
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-v2-${{ runner.os }}-

      - name: Derive version from tag
        id: version
        run: |
          # 去掉前缀 v，得到形如 0.0.7 的语义化版本。
          NAME="${GITHUB_REF_NAME#v}"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须形如 v0.0.7（三段语义化版本），当前为 ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          # versionCode 只增不减：major*1000000 + minor*10000 + patch*100。
          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Guard sync endpoint
        env:
          SYNC_BASE_URL: ${{ secrets.LEMON_SYNC_BASE_URL }}
        run: |
          if [ -z "$SYNC_BASE_URL" ]; then
            echo "sync base url = <未设置，使用包内默认 Supabase 地址>"
            exit 0
          fi
          # 去掉结尾斜杠：secret 里多写一个「/」会拼出 //auth/v1/settings。
          BASE="${SYNC_BASE_URL%/}"
          HOST="$(echo "$BASE" | sed -E 's#^https?://##; s#/.*$##')"
          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "同步服务端域名无法解析：$HOST（检查 secret 是否拼错）" >&2
            exit 1
          fi
          # publishable key 是公开值（与 app/build.gradle.kts 里的默认值一致），
          # 不带它 Supabase 网关对所有路径都回 401，探活会失去意义。
          KEY="sb_publishable_lmgqjXC0mF7MLozkLF-HwA_O7xhiezA"
          SB_RAW="$(curl -s -m 20 -H "apikey: $KEY" -w '\n%{http_code}' "$BASE/auth/v1/settings" || true)"
          SB="$(echo "$SB_RAW" | tail -n1)"
          SB_BODY="$(echo "$SB_RAW" | sed '$d')"
          WORKER_BODY="$(curl -s -m 20 "$BASE/health" || true)"
          echo "sync host = $HOST, /auth/v1/settings -> HTTP ${SB}, /health -> ${WORKER_BODY:-<无响应>}"
          # Supabase（含反代域名）或旧 Worker 任一可用即放行。
          if [ "$SB" = "200" ] || echo "$WORKER_BODY" | grep -q '"ok":true'; then
            exit 0
          fi
          # 403 + Cloudflare 人机校验 = GitHub 机房出口 IP 被 challenge，不代表 App 连不上：
          # 真实设备走住宅网络实测 200，这里只告警不拦发布。
          if echo "$SB_BODY" | grep -q 'cf_chl_opt\|Just a moment' \
             || echo "$WORKER_BODY" | grep -q 'cf_chl_opt\|Just a moment'; then
            echo "警告：Cloudflare 对 CI 出口 IP 发起人机校验（403），按可达处理" >&2
            exit 0
          fi
          echo "同步服务端不可用：$BASE（Supabase 与旧 Worker 探活都失败）" >&2
          exit 1

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_LEMON_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ORG_GRADLE_PROJECT_LEMON_KEYSTORE_PASSWORD: ${{ secrets.LEMON_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LEMON_KEY_ALIAS: ${{ secrets.LEMON_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LEMON_KEY_PASSWORD: ${{ secrets.LEMON_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_LEMON_SYNC_BASE_URL: ${{ secrets.LEMON_SYNC_BASE_URL }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PlemonVersionName="${{ steps.version.outputs.name }}" \
            -PlemonVersionCode="${{ steps.version.outputs.code }}" \
            -PlemonApkOutputDir="$RUNNER_TEMP/dist"

      - name: Rename APK to versioned ASCII name
        # 用纯 ASCII 文件名（lemonbox-<版本>.apk）：GitHub 会重写含非 ASCII 字符的资产名，
        # 之前「柠檬百宝箱.apk」被服务端改成了 default.apk，故改用 ASCII 命名固定下载名。
        run: cp app/build/outputs/apk/release/app-release.apk "lemonbox-${{ steps.version.outputs.name }}.apk"

      - name: Generate SHA-256 checksum
        # 应用内「下载并校验安装」会读取这个同名 .sha256 资产；缺失时仍会做签名校验，
        # 但多一层完整性校验能让代理/镜像篡改更容易被立刻发现。
        run: |
          sha256sum "lemonbox-${{ steps.version.outputs.name }}.apk" \
            | awk '{print $1}' > "lemonbox-${{ steps.version.outputs.name }}.apk.sha256"
          cat "lemonbox-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Delete existing release for this tag
        # 对同一 tag 重新发布时，先删除旧 Release 及其资产（例如曾被 GitHub 改名的 default.apk），
        # 避免新旧资产并存；首次发布时为 no-op。用 runner 自带 GITHUB_TOKEN，无需本地凭据。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            lemonbox-${{ steps.version.outputs.name }}.apk
            lemonbox-${{ steps.version.outputs.name }}.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
