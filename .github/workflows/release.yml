name: Release APK

# 触发方式：推送形如 v0.0.7 的 tag 时自动构建并发布。
# 版本号来源：versionName 取 tag（去掉前缀 v），versionCode 由 tag 推导，
# 保证与「检查更新」里对比的 GitHub tag 完全一致。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LEMON_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Derive version from tag
        id: version
        run: |
          # 去掉前缀 v，得到形如 0.0.7 的语义化版本。
          NAME="${GITHUB_REF_NAME#v}"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须形如 v0.0.7（三段语义化版本），当前为 ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          MAJOR="${NAME%%.*}"
          REST="${NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          # versionCode 只增不减：major*1000000 + minor*10000 + patch*100。
          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_LEMON_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ORG_GRADLE_PROJECT_LEMON_KEYSTORE_PASSWORD: ${{ secrets.LEMON_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LEMON_KEY_ALIAS: ${{ secrets.LEMON_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LEMON_KEY_PASSWORD: ${{ secrets.LEMON_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PlemonVersionName="${{ steps.version.outputs.name }}" \
            -PlemonVersionCode="${{ steps.version.outputs.code }}" \
            -PlemonApkOutputDir="$RUNNER_TEMP/dist"

      - name: Rename APK to Chinese name
        run: cp app/build/outputs/apk/release/app-release.apk "柠檬百宝箱.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 柠檬百宝箱.apk
          generate_release_notes: true
          draft: false
          prerelease: false
