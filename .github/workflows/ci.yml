name: CI

# 每次 push / PR 都跑编译与单元测试。
# 发布仍由 release.yml 在 tag 上执行；这里只负责「逻辑改动别悄悄退化」。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # 与 release.yml 保持一致：固定 24.04，避免 ubuntu-latest 迁移导致 SDK 版本漂移。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Point Gradle wrapper at official distribution
        # 本地走腾讯云镜像；GitHub runner 上不可达，且默认 10s 超时会直接失败。
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's#networkTimeout=10000#networkTimeout=60000#' gradle/wrapper/gradle-wrapper.properties

      - name: Write local.properties
        # ubuntu-24.04 runner 已预装 Android SDK，直接指向它。
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-v2-${{ runner.os }}-

      - name: Compile and unit test
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest \
            --no-daemon --console=plain --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
